<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>HOLDOUT — Top-Down Survival</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0d0b; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: none; touch-action: none;
           user-select: none; -webkit-user-select: none; outline: none; }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<script>
"use strict";
(() => {
// =====================================================================
//  CONSTANTS & UTILITIES
// =====================================================================
const W = 1600, H = 1000;          // arena size in world units
const BORDER = 46;                 // perimeter wall thickness (drawn outside the arena)
const EDGE_CLEAR = 130;            // obstacle-free band along the walls (spawn lanes)
const TAU = Math.PI * 2;
const FONT = "'Bahnschrift', 'DIN Alternate', 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', Arial, sans-serif";
const MONO = "'Consolas', 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace";
const HS_KEY = 'holdout.highScore';
const COMBO_WINDOW = 2.0;
const COL = {
  ui: '#e8e2d0', uiDim: 'rgba(232,226,208,0.55)', amber: '#e0b252', red: '#c8452d', olive: '#8fbf4a',
  tracer: '#ffe2a0', tracerHot: '#ffab4a', spit: '#a8d43a', queenSpit: '#c0508e',
  medkit: '#7fc25a', ammo: '#e0b252', barrier: '#6fb6ff',
  ichorRunner: '#7d8f2a', ichorTank: '#556b2f', ichorSpitter: '#a3c43a', ichorQueen: '#6e2d5c'
};
const BOSS_NAMES = ['BROOD QUEEN', 'THE MATRIARCH', 'HIVE COLOSSUS', 'DEEP MOTHER', 'THE DEVOURER'];

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
function angLerp(a, b, t) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return a + d * t; }
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; }
function compact(arr) { let j = 0; for (let i = 0; i < arr.length; i++) { const o = arr[i]; if (!o.dead) arr[j++] = o; } arr.length = j; }
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function randiR(R, a, b) { return a + Math.floor(R() * (b - a + 1)); }
function loadHigh() { try { return parseInt(localStorage.getItem(HS_KEY), 10) || 0; } catch (e) { return 0; } }
function saveHigh(v) { try { localStorage.setItem(HS_KEY, String(v)); } catch (e) { /* storage unavailable */ } }

// =====================================================================
//  CANVAS / VIEW
// =====================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let cssW = 0, cssH = 0, dpr = 1, ui = 1;
const view = { scale: 1, ox: 0, oy: 0 };
let floorCanvas = null, bgCanvas = null, vignetteCanvas = null;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cssW = Math.max(1, window.innerWidth);
  cssH = Math.max(1, window.innerHeight);
  canvas.width = Math.floor(cssW * dpr);
  canvas.height = Math.floor(cssH * dpr);
  view.scale = Math.min(cssW / (W + BORDER * 2), cssH / (H + BORDER * 2));
  view.ox = (cssW - W * view.scale) / 2;
  view.oy = (cssH - H * view.scale) / 2;
  ui = clamp(Math.min(cssW / 1100, cssH / 720), 0.55, 1.6);
  buildBackground();
  if (map) buildFloor();
}

function buildBackground() {
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = canvas.width; bgCanvas.height = canvas.height;
  const b = bgCanvas.getContext('2d');
  b.fillStyle = '#0d0d0b'; b.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
  for (let i = 0; i < 900; i++) {   // dark gravel outside the compound
    b.fillStyle = `rgba(${randi(40, 70)},${randi(38, 62)},${randi(30, 50)},${rand(0.2, 0.6)})`;
    const s = rand(1, 3.5) * dpr;
    b.fillRect(rand(0, bgCanvas.width), rand(0, bgCanvas.height), s, s);
  }
  vignetteCanvas = document.createElement('canvas');
  vignetteCanvas.width = canvas.width; vignetteCanvas.height = canvas.height;
  const v = vignetteCanvas.getContext('2d');
  const cw = canvas.width, ch = canvas.height;
  const gr = v.createRadialGradient(cw / 2, ch / 2, Math.min(cw, ch) * 0.35, cw / 2, ch / 2, Math.max(cw, ch) * 0.75);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.55)');
  v.fillStyle = gr; v.fillRect(0, 0, cw, ch);
}

// Additive light sprites (muzzle flashes, fire, acid glow)
const glowCache = {};
function glowSprite(color) {
  let c = glowCache[color];
  if (c) return c;
  c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d');
  const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, hexA(color, 0.9)); gr.addColorStop(0.25, hexA(color, 0.45));
  gr.addColorStop(0.6, hexA(color, 0.1)); gr.addColorStop(1, hexA(color, 0));
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
  return (glowCache[color] = c);
}
function drawGlow(color, x, y, r, alpha) {
  if (alpha <= 0) return;
  ctx.globalAlpha = Math.min(1, alpha);
  ctx.drawImage(glowSprite(color), x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = 1;
}
function ellipse(c, x, y, rx, ry, rot = 0) { c.beginPath(); c.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, TAU); }
function circle(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(0.1, r), 0, TAU); }
function roundRect(c, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath();
  c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.arcTo(x + w, y, x + w, y + r, r);
  c.lineTo(x + w, y + h - r); c.arcTo(x + w, y + h, x + w - r, y + h, r);
  c.lineTo(x + r, y + h); c.arcTo(x, y + h, x, y + h - r, r);
  c.lineTo(x, y + r); c.arcTo(x, y, x + r, y, r); c.closePath();
}
function shadow(x, y, rx, ry, a = 0.32) { ctx.fillStyle = `rgba(0,0,0,${a})`; ellipse(ctx, x + 5, y + 7, rx, ry); ctx.fill(); }

// =====================================================================
//  DECALS (persistent ground marks: ichor, scorch, casings, debris)
// =====================================================================
const DS = 1.5;
const decal = document.createElement('canvas');
decal.width = W * DS; decal.height = H * DS;
const dctx = decal.getContext('2d');
dctx.setTransform(DS, 0, 0, DS, 0, 0);
let decalFadeT = 0;
function clearDecals() { dctx.setTransform(1, 0, 0, 1, 0, 0); dctx.clearRect(0, 0, decal.width, decal.height); dctx.setTransform(DS, 0, 0, DS, 0, 0); }
function fadeDecals(dt) {
  decalFadeT -= dt;
  if (decalFadeT > 0) return;
  decalFadeT = 5;
  dctx.globalCompositeOperation = 'destination-out';
  dctx.fillStyle = 'rgba(0,0,0,0.04)'; dctx.fillRect(0, 0, W, H);
  dctx.globalCompositeOperation = 'source-over';
}
function stampSplat(x, y, color, r, alpha = 0.55) {
  dctx.fillStyle = color;
  dctx.globalAlpha = alpha;
  for (let i = 0; i < 5; i++) { circle(dctx, x + rand(-r, r) * 0.5, y + rand(-r, r) * 0.5, r * rand(0.35, 0.65)); dctx.fill(); }
  for (let i = 0; i < 9; i++) {
    const a = rand(0, TAU), d = r * rand(0.7, 1.8);
    circle(dctx, x + Math.cos(a) * d, y + Math.sin(a) * d, r * rand(0.06, 0.16)); dctx.fill();
  }
  dctx.globalAlpha = 1;
}
function stampScorch(x, y, r) {
  const gr = dctx.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, 'rgba(12,10,8,0.8)'); gr.addColorStop(0.6, 'rgba(18,14,10,0.45)'); gr.addColorStop(1, 'rgba(20,16,12,0)');
  dctx.fillStyle = gr; circle(dctx, x, y, r); dctx.fill();
  dctx.strokeStyle = 'rgba(10,8,6,0.35)'; dctx.lineWidth = 2;
  for (let i = 0; i < 12; i++) {
    const a = rand(0, TAU);
    dctx.beginPath(); dctx.moveTo(x + Math.cos(a) * r * 0.3, y + Math.sin(a) * r * 0.3);
    dctx.lineTo(x + Math.cos(a) * r * rand(0.9, 1.4), y + Math.sin(a) * r * rand(0.9, 1.4)); dctx.stroke();
  }
}
function stampHole(x, y, r) {
  dctx.fillStyle = 'rgba(52,40,28,0.55)';
  for (let i = 0; i < 7; i++) { circle(dctx, x + rand(-r, r) * 0.6, y + rand(-r, r) * 0.6, r * rand(0.4, 0.8)); dctx.fill(); }
  dctx.fillStyle = 'rgba(14,11,8,0.75)'; circle(dctx, x, y, r * 0.55); dctx.fill();
}
function stampShell(x, y, rot) {
  dctx.save(); dctx.translate(x, y); dctx.rotate(rot);
  dctx.fillStyle = '#a9853e'; dctx.fillRect(-2.6, -1.1, 5.2, 2.2);
  dctx.fillStyle = '#6b5022'; dctx.fillRect(-2.6, -1.1, 1.2, 2.2);
  dctx.restore();
}
function stampChunk(x, y, rot, size, color) {
  dctx.save(); dctx.translate(x, y); dctx.rotate(rot);
  dctx.fillStyle = color; dctx.globalAlpha = 0.85;
  dctx.beginPath(); dctx.moveTo(size * 0.6, 0); dctx.lineTo(-size * 0.3, size * 0.5); dctx.lineTo(-size * 0.5, -size * 0.35); dctx.closePath(); dctx.fill();
  dctx.restore(); dctx.globalAlpha = 1;
}

// =====================================================================
//  AUDIO (Web Audio API, fully synthesized)
// =====================================================================
const Sfx = (() => {
  let ac = null, master = null, noiseBuf = null, muted = false;
  const last = {};
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ac = new AC();
      master = ac.createGain(); master.gain.value = muted ? 0 : 0.6;
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 5;
      master.connect(comp); comp.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
  }
  const ok = () => ac && ac.state === 'running' && !muted;
  function throttle(name, gap) {
    const t = performance.now() / 1000;
    if (last[name] !== undefined && t - last[name] < gap) return false;
    last[name] = t; return true;
  }
  function tone({ type = 'square', f0 = 440, f1 = f0, dur = 0.1, vol = 0.2, delay = 0, attack = 0.004 }) {
    if (!ok()) return;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noise({ dur = 0.2, vol = 0.3, f0 = 2000, f1 = 200, type = 'lowpass', q = 0.8, delay = 0, attack = 0.002 }) {
    if (!ok()) return;
    const t = ac.currentTime + delay;
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t, Math.random() * 0.6, dur + 0.05);
  }
  return {
    init,
    get muted() { return muted; },
    toggleMute() { muted = !muted; if (master) master.gain.setTargetAtTime(muted ? 0 : 0.6, ac.currentTime, 0.02); },
    shoot(rapid) {
      if (!throttle('shoot', 0.03)) return;
      noise({ dur: rapid ? 0.07 : 0.1, vol: 0.2, f0: rapid ? 4200 : 3200, f1: 500 });
      tone({ type: 'sine', f0: rapid ? 170 : 140, f1: 45, dur: 0.08, vol: 0.16 });
      if (throttle('tink', 0.11)) tone({ type: 'sine', f0: rand(3600, 4400), dur: 0.05, vol: 0.012, delay: rand(0.25, 0.4) });
    },
    hitFlesh() {
      if (!throttle('hitF', 0.035)) return;
      noise({ dur: 0.07, vol: 0.14, f0: 1100, f1: 250, type: 'bandpass', q: 1.2 });
      tone({ type: 'sine', f0: 180, f1: 90, dur: 0.06, vol: 0.06 });
    },
    hitHard(mat) {
      if (!throttle('hitH', 0.04)) return;
      if (mat === 'metal') { tone({ type: 'triangle', f0: 920, f1: 760, dur: 0.16, vol: 0.05 }); noise({ dur: 0.04, vol: 0.06, f0: 5000, f1: 2500, type: 'highpass' }); }
      else if (mat === 'wood') { noise({ dur: 0.06, vol: 0.12, f0: 700, f1: 250, type: 'bandpass', q: 2 }); tone({ type: 'square', f0: 160, f1: 110, dur: 0.04, vol: 0.03 }); }
      else if (mat === 'sand') noise({ dur: 0.09, vol: 0.1, f0: 1600, f1: 300 });
      else {
        noise({ dur: 0.05, vol: 0.08, f0: 4000, f1: 1500, type: 'highpass' });
        if (Math.random() < 0.25) tone({ type: 'sine', f0: rand(2200, 2800), f1: rand(1300, 1600), dur: 0.14, vol: 0.025 });
      }
    },
    squelch(size) {
      if (!throttle('squelch', 0.03)) return;
      noise({ dur: 0.18 + 0.2 * size, vol: 0.18 + 0.1 * size, f0: 1400, f1: 180, type: 'bandpass', q: 1.5 });
      tone({ type: 'sine', f0: 260 - 80 * size, f1: 60, dur: 0.15 + 0.2 * size, vol: 0.1 + 0.08 * size });
    },
    explosion() {
      noise({ dur: 1.1, vol: 0.5, f0: 3200, f1: 60 });
      tone({ type: 'sine', f0: 95, f1: 28, dur: 0.9, vol: 0.45 });
      noise({ dur: 0.5, vol: 0.12, f0: 6000, f1: 1500, type: 'highpass', delay: 0.05 });
    },
    destroy(mat) {
      if (mat === 'wood') { noise({ dur: 0.3, vol: 0.25, f0: 1500, f1: 200, type: 'bandpass', q: 0.8 }); tone({ type: 'square', f0: 120, f1: 60, dur: 0.12, vol: 0.06 }); }
      else noise({ dur: 0.45, vol: 0.22, f0: 1200, f1: 100 });
    },
    hurt() {
      tone({ type: 'sawtooth', f0: 190, f1: 85, dur: 0.22, vol: 0.12 });
      noise({ dur: 0.15, vol: 0.18, f0: 900, f1: 150 });
    },
    block() { if (throttle('block', 0.05)) { tone({ type: 'sine', f0: 1300, f1: 650, dur: 0.12, vol: 0.06 }); noise({ dur: 0.05, vol: 0.05, f0: 6000, f1: 3000, type: 'highpass' }); } },
    pickup(kind) {
      noise({ dur: 0.025, vol: 0.12, f0: 5000, f1: 3000, type: 'highpass' });
      noise({ dur: 0.03, vol: 0.12, f0: 4000, f1: 2000, type: 'highpass', delay: 0.09 });
      if (kind === 'medkit') tone({ type: 'sine', f0: 660, f1: 880, dur: 0.2, vol: 0.06, delay: 0.05 });
      else if (kind === 'ammo') tone({ type: 'square', f0: 220, f1: 200, dur: 0.06, vol: 0.05, delay: 0.12 });
      else tone({ type: 'sine', f0: 200, f1: 700, dur: 0.35, vol: 0.07 });
    },
    spit() { if (throttle('spit', 0.05)) { tone({ type: 'sine', f0: 280, f1: 720, dur: 0.09, vol: 0.07 }); noise({ dur: 0.08, vol: 0.06, f0: 2000, f1: 800, type: 'bandpass' }); } },
    splash() { if (throttle('splash', 0.05)) noise({ dur: 0.12, vol: 0.07, f0: 1800, f1: 400, type: 'bandpass', q: 1 }); },
    dig() { if (throttle('dig', 0.12)) noise({ dur: 0.25, vol: 0.06, f0: 500, f1: 150 }); },
    emerge() { if (throttle('emerge', 0.08)) { noise({ dur: 0.2, vol: 0.09, f0: 900, f1: 200 }); tone({ type: 'sine', f0: 120, f1: 60, dur: 0.15, vol: 0.06 }); } },
    siren() {
      if (!ok()) return;
      const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
      o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 1400;
      o.frequency.setValueAtTime(320, t);
      for (let i = 0; i < 2; i++) { o.frequency.linearRampToValueAtTime(620, t + 0.45 + i * 0.9); o.frequency.linearRampToValueAtTime(320, t + 0.9 + i * 0.9); }
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.05, t + 0.1);
      g.gain.setValueAtTime(0.05, t + 1.6); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.85);
      o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + 1.9);
    },
    radio() { noise({ dur: 0.08, vol: 0.06, f0: 3000, f1: 2500, type: 'bandpass', q: 3 }); [880, 1175].forEach((fq, i) => tone({ type: 'square', f0: fq, dur: 0.07, vol: 0.035, delay: 0.1 + i * 0.09 })); },
    horn() {
      for (let i = 0; i < 2; i++) {
        tone({ type: 'sawtooth', f0: 68, f1: 64, dur: 0.9, vol: 0.12, delay: i * 1.0, attack: 0.08 });
        tone({ type: 'sawtooth', f0: 70.5, f1: 66, dur: 0.9, vol: 0.1, delay: i * 1.0, attack: 0.08 });
      }
    },
    roar() {
      tone({ type: 'sawtooth', f0: 95, f1: 42, dur: 1.0, vol: 0.16, attack: 0.05 });
      tone({ type: 'sawtooth', f0: 101, f1: 45, dur: 1.0, vol: 0.12, attack: 0.05 });
      noise({ dur: 0.9, vol: 0.2, f0: 700, f1: 120, type: 'bandpass', q: 0.7, attack: 0.05 });
    },
    stomp() { if (throttle('stomp', 0.1)) { noise({ dur: 0.35, vol: 0.25, f0: 500, f1: 60 }); tone({ type: 'sine', f0: 70, f1: 30, dur: 0.3, vol: 0.25 }); } },
    combo(m) { tone({ type: 'triangle', f0: 500 + m * 70, dur: 0.07, vol: 0.05 }); },
    click() { noise({ dur: 0.02, vol: 0.1, f0: 4000, f1: 2500, type: 'highpass' }); tone({ type: 'square', f0: 300, dur: 0.03, vol: 0.03 }); },
    hover() { if (throttle('hover', 0.05)) noise({ dur: 0.015, vol: 0.05, f0: 6000, f1: 4000, type: 'highpass' }); },
    start() { noise({ dur: 0.03, vol: 0.15, f0: 3000, f1: 1500, type: 'highpass' }); noise({ dur: 0.05, vol: 0.15, f0: 2500, f1: 900, type: 'highpass', delay: 0.14 }); tone({ type: 'square', f0: 140, f1: 120, dur: 0.06, vol: 0.06, delay: 0.14 }); },
    pause() { noise({ dur: 0.05, vol: 0.08, f0: 2000, f1: 800, type: 'bandpass' }); },
    gameOver() { [220, 196, 165, 131].forEach((f, i) => tone({ type: 'triangle', f0: f, f1: f * 0.97, dur: 0.6, vol: 0.1, delay: i * 0.3 })); },
    playerDeath() { noise({ dur: 0.8, vol: 0.3, f0: 1500, f1: 60 }); tone({ type: 'sawtooth', f0: 160, f1: 40, dur: 0.6, vol: 0.12 }); },
    bossDeath() {
      for (let i = 0; i < 5; i++) noise({ dur: 0.6, vol: 0.28, f0: 1500, f1: 60, type: 'bandpass', q: 0.6, delay: i * 0.14 });
      tone({ type: 'sawtooth', f0: 90, f1: 25, dur: 1.8, vol: 0.2, attack: 0.05 });
    }
  };
})();

// =====================================================================
//  INPUT
// =====================================================================
const keys = {};
const mouse = { x: -100, y: -100, wx: W / 2, wy: H / 2, down: false, kick: 0 };
let buttons = [];
let hovered = null;
const keyDown = code => !!keys[code];

window.addEventListener('keydown', e => {
  Sfx.init();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.repeat) return;
  onKey(e.code);
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  mouse.down = false;
  if (state === 'playing') setPaused(true);
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'playing') setPaused(true); });
function updatePointer(e) { mouse.x = e.clientX; mouse.y = e.clientY; }
window.addEventListener('pointermove', updatePointer);
canvas.addEventListener('pointerdown', e => {
  Sfx.init();
  canvas.focus();
  updatePointer(e);
  if (e.button !== 0) return;

      pg.addColorStop(0, 'rgba(34,32,28,0.45)'); pg.addColorStop(1, 'rgba(34,32,28,0)');
      f.fillStyle = pg; ellipse(f, px, py, w, w * 0.7); f.fill();

  f.fillStyle = gr; f.fillRect(0, 0, W, sh);
  gr = f.createLinearGradient(0, 0, sh, 0); gr.addColorStop(0, 'rgba(0,0,0,0.5)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  f.fillStyle = gr; f.fillRect(0, 0, sh, H);
  gr = f.createLinearGradient(0, H, 0, H - 10); gr.addColorStop(0, 'rgba(0,0,0,0.3)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  f.fillStyle = gr; f.fillRect(0, H - 10, W, 10);
  gr = f.createLinearGradient(W, 0, W - 10, 0); gr.addColorStop(0, 'rgba(0,0,0,0.3)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  f.fillStyle = gr; f.fillRect(W - 10, 0, 10, H);

  // perimeter wall (poured concrete blocks)
  const B = BORDER;
  f.fillStyle = '#6e6c64';
  for (const [x, y, w, h] of [[-B, -B, W + 2 * B, B], [-B, H, W + 2 * B, B], [-B, 0, B, H], [W, 0, B, H]]) f.fillRect(x, y, w, h);
  f.strokeStyle = 'rgba(30,28,24,0.6)'; f.lineWidth = 2;

  for (let y = 0; y < H; y += 90) { f.beginPath(); f.moveTo(-B, y); f.lineTo(0, y); f.moveTo(W, y + 45); f.lineTo(W + B, y + 45); f.stroke(); }
  for (let i = 0; i < 2500; i++) {

    if (side === 0) { x = rr(-B, W + B); y = rr(-B, 0); } else if (side === 1) { x = rr(-B, W + B); y = rr(H, H + B); }
    else if (side === 2) { x = rr(-B, 0); y = rr(0, H); } else { x = rr(W, W + B); y = rr(0, H); }
    f.fillStyle = R() < 0.5 ? 'rgba(0,0,0,0.12)' : 'rgba(255,250,235,0.07)';

  f.fillRect(-B, -B, W + 2 * B, 3); f.fillRect(-B, -B, 3, H + 2 * B);
  f.fillStyle = 'rgba(0,0,0,0.35)';
  f.fillRect(-B, H + B - 4, W + 2 * B, 4); f.fillRect(W + B - 4, -B, 4, H + 2 * B);
  // hazard-striped curb along the inner edge
  f.save();
  f.beginPath(); f.rect(-10, -10, W + 20, H + 20); f.rect(0, 0, W, H); f.clip('evenodd');
  f.fillStyle = 'rgba(200,160,50,0.55)'; f.fillRect(-10, -10, W + 20, H + 20);
  f.fillStyle = 'rgba(25,22,18,0.85)';
  for (let s = -40; s < W + H + 40; s += 28) {
    f.beginPath(); f.moveTo(s, -12); f.lineTo(s + 14, -12); f.lineTo(s + 14 - H - 24, H + 12); f.lineTo(s - H - 24, H + 12); f.closePath(); f.fill();
  }
  f.restore();
}

// ---------------------------------------------------------------------

function sparks(x, y, ang, spread, n, color = '#ffd27a', sp0 = 150, sp1 = 500, life = 0.25) {

function settle(p) {

  if (p.kind === 'shell') stampShell(p.x, p.y, p.rot);

  else if (p.kind === 'drop') { dctx.fillStyle = p.color; dctx.globalAlpha = 0.6; circle(dctx, p.x, p.y, p.size * 0.8); dctx.fill(); dctx.globalAlpha = 1; }
}

function updateFx(dt) {
  for (const p of particles) {
    p.life -= dt;
    if (p.life <= 0) { p.dead = true; continue; }
    if (p.drag) { const k = Math.exp(-p.drag * dt); p.vx *= k; p.vy *= k; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.grow) p.size += p.grow * dt;
  }
  compact(particles);
  for (const p of ground) {
    p.life -= dt;
    const k = Math.exp(-p.drag * dt); p.vx *= k; p.vy *= k;
    const nx = p.x + p.vx * dt, ny = p.y + p.vy * dt;
    if (obstacleAt(nx, ny)) { p.vx *= -0.35; p.vy *= -0.35; }   // debris bounces off cover

    if (p.vr) { p.rot += p.vr * dt; p.vr *= Math.exp(-3 * dt); }
    if (p.kind === 'shell' && p.bounce > 0 && p.life < p.bounceAt) { p.bounce--; p.bounceAt -= 0.15; p.vx *= 0.6; p.vy *= 0.6; p.vr *= -0.8; }
    if (p.life <= 0) { p.dead = true; settle(p); }
  }
  compact(ground);
  for (const t of texts) { t.life -= dt; t.y += t.vy * dt; t.vy *= Math.exp(-2 * dt); if (t.life <= 0) t.dead = true; }
  compact(texts);
}

// ---------------------------------------------------------------------
//  WAVES & SPAWNING (smooth difficulty curve)
// ---------------------------------------------------------------------
const isBossWave = n => n % 5 === 0;
function waveCount(n) { return Math.floor(6 + 2.6 * (n - 1) + 0.1 * (n - 1) * (n - 1)); }
function spawnInterval(n) { return Math.max(0.28, 1.15 - 0.055 * (n - 1)); }
function maxAlive(n) { return Math.min(45, 8 + n * 2); }
function speedMul(n) { return 1 + Math.min(0.4, (n - 1) * 0.025); }

function buildWave(n) {
  const list = [];
  if (isBossWave(n)) {
    list.push('boss');
    const esc = 2 + Math.floor(n / 5) * 2;
    for (let i = 0; i < esc; i++) list.push(Math.random() < 0.6 ? 'runner' : 'shooter');
    return list;
  }
  const count = waveCount(n);
  const wr = 1, ws = n >= 2 ? Math.min(0.55, 0.15 + (n - 2) * 0.08) : 0, wt = n >= 3 ? Math.min(0.45, 0.12 + (n - 3) * 0.06) : 0;
  const tot = wr + ws + wt;
  for (let i = 0; i < count; i++) { const r = Math.random() * tot; list.push(r < wr ? 'runner' : r < wr + ws ? 'shooter' : 'tank'); }
  if (n === 2) list[1] = 'shooter';
  if (n === 3) list[2] = 'tank';
  return list;
}
function startWave(n) {
  g.wave = n;
  g.queue = buildWave(n);
  g.waveState = 'active';
  g.spawnT = 0.6;
  if (isBossWave(n)) {
    const k = n / 5;
    showBanner('BOSS WAVE', BOSS_NAMES[(k - 1) % BOSS_NAMES.length] + ' IS BURROWING IN', COL.red, 3.2);
    Sfx.horn(); addTrauma(0.3);
  } else {
    showBanner('WAVE ' + n, waveSubtitle(n), COL.ui);
    Sfx.siren();
  }
}
function waveSubtitle(n) {
  if (n === 1) return 'Skitterers inbound — they tunnel up near the walls';
  if (n === 2) return 'Spitters sighted — break line of sight';
  if (n === 3) return 'Armored beetles detected';
  return waveCount(n) + ' hostiles';
}
function edgePoint(margin) {
  const side = randi(0, 3);
  if (side === 0) return { x: rand(margin, W - margin), y: margin };
  if (side === 1) return { x: W - margin, y: rand(margin, H - margin) };
  if (side === 2) return { x: rand(margin, W - margin), y: H - margin };
  return { x: margin, y: rand(margin, H - margin) };
}
function spawnPoint(minDist = 340) {
  const p = g.p;
  let best = null, bd = -1;
  for (let i = 0; i < 14; i++) {
    const pt = edgePoint(rand(40, 80));
    if (obstacleAt(pt.x, pt.y, 30)) continue;
    const d = Math.hypot(pt.x - p.x, pt.y - p.y);
    if (d > minDist) return pt;
    if (d > bd) { bd = d; best = pt; }
  }
  return best || { x: 60, y: 60 };
}
function addSpawn(type, x, y, dur) {
  const cracks = [];
  for (let i = 0; i < 7; i++) cracks.push([rand(0, TAU), rand(0.7, 1.3)]);
  g.spawns.push({ type, x, y, t: 0, dur, dead: false, cracks, dustT: 0 });
}
function updateWaves(dt) {
  if (g.waveState === 'break') {
    g.breakT -= dt;
    if (g.breakT <= 0 && !g.p.dead) startWave(g.wave + 1);
    return;
  }
  const n = g.wave;
  if (g.queue.length) {
    g.spawnT -= dt;
    const alive = g.enemies.length + g.spawns.length;
    if (g.spawnT <= 0 && alive < maxAlive(n)) {
      const type = g.queue.shift();
      if (type === 'boss') {
        const pts = [{ x: W / 2, y: 68 }, { x: W / 2, y: H - 68 }, { x: 68, y: H / 2 }, { x: W - 68, y: H / 2 }];
        pts.sort((a, b) => Math.hypot(b.x - g.p.x, b.y - g.p.y) - Math.hypot(a.x - g.p.x, a.y - g.p.y));
        addSpawn('boss', pts[0].x, pts[0].y, 2.2);
        g.spawnT = 3.5;
      } else {
        const pt = spawnPoint();
        addSpawn(type, pt.x, pt.y, 0.9);
        let packed = 0;
        while (type === 'runner' && n >= 3 && g.queue[0] === 'runner' && packed < 3 && Math.random() < 0.55) {
          g.queue.shift(); packed++;
          let px = clamp(pt.x + rand(-60, 60), 30, W - 30), py = clamp(pt.y + rand(-60, 60), 30, H - 30);
          if (obstacleAt(px, py, 20)) { px = pt.x; py = pt.y; }
          addSpawn('runner', px, py, 0.9 + packed * 0.1);
        }
        g.spawnT = spawnInterval(n) * rand(0.6, 1.4) * (1 + packed * 0.6);
      }
    }
  }
  if (!g.queue.length && !g.spawns.length && !g.enemies.length) waveClear();
}
function waveClear() {
  const bonus = 250 * g.wave;
  g.score += bonus;
  const p = g.p;
  if (!p.dead) {
    const heal = Math.min(p.maxHp - p.hp, 10);
    p.hp += heal;
    if (heal > 0) floatText(p.x, p.y - 30, '+' + Math.round(heal) + ' HP', COL.olive);
  }
  showBanner('WAVE ' + g.wave + ' CLEARED', '+' + bonus.toLocaleString() + ' bonus · patched up', COL.olive, 2.4);
  g.waveState = 'break';
  g.breakT = 3.4;
  Sfx.radio();
}

// ---------------------------------------------------------------------
//  ENEMIES
// ---------------------------------------------------------------------
function crackSet() { return Array.from({ length: 6 }, () => [rand(-0.9, 0.9), rand(-0.7, 0.7), rand(0, TAU), rand(5, 11)]); }
function createEnemy(type, x, y) {
  const n = g.wave, sm = speedMul(n);
  const base = { type, x, y, vx: 0, vy: 0, flash: 0, t: rand(0, 5), head: Math.atan2(g.p.y - y, g.p.x - x), gait: rand(0, TAU),
                 spawnT: 0, shieldHitT: 0, dead: false, losT: 0, los: false };
  let e;
  switch (type) {
    case 'runner':
      e = Object.assign(base, { r: 13, hp: 1 + Math.floor((n - 1) / 7), speed: 200 * sm * rand(0.92, 1.08), dmg: 12, score: 100, mass: 1,
        wob: rand(0, TAU), ichor: COL.ichorRunner });
      break;
    case 'tank':
      e = Object.assign(base, { r: 27, hp: 7 + Math.floor(n * 0.7), speed: 60 * sm, dmg: 25, score: 300, mass: 5, ichor: COL.ichorTank, cracks: crackSet() });
      break;
    case 'shooter':
      e = Object.assign(base, { r: 17, hp: 3 + Math.floor(n / 4), speed: 120 * sm, dmg: 10, score: 200, mass: 1.6, ichor: COL.ichorSpitter,
        fireT: rand(1.4, 2.4), strafe: Math.random() < 0.5 ? 1 : -1, flipT: rand(2, 4), prefer: rand(260, 360) });
      break;
    case 'boss': {
      const k = Math.max(1, Math.round(n / 5));
      const hp = 140 + 90 * (k - 1);
      e = Object.assign(base, { r: 52, hp, speed: 85 + 8 * k, dmg: 30, score: 5000 * k, mass: 60, k, ichor: COL.ichorQueen,
        name: BOSS_NAMES[(k - 1) % BOSS_NAMES.length], pat: 'move', pt: 2.2, cycle: 0, fireT: 0, spin: 0, sub: 0,
        cdx: 0, cdy: 0, charges: 0, enraged: false });
      g.boss = e;
      Sfx.roar(); addTrauma(0.8);
      break;
    }
  }
  e.maxHp = e.hp;
  return e;
}
// Direction toward the player: straight line when visible, flow-field around cover otherwise.
function steer(e, dt, d, ux, uy) {
  e.losT -= dt;
  if (e.losT <= 0) { e.losT = rand(0.15, 0.3); e.los = hasLOS(e.x, e.y, g.p.x, g.p.y, Math.min(e.r * 0.8, 20)); }
  if (e.los || d < e.r + 40) return [ux, uy];
  return flowDir(e.x, e.y) || [ux, uy];
}
function updateEnemies(dt) {
  const p = g.p;
  for (const e of g.enemies) {
    e.t += dt;
    e.flash = Math.max(0, e.flash - dt);
    e.spawnT = Math.min(1, e.spawnT + dt * 2.5);
    e.shieldHitT = Math.max(0, e.shieldHitT - dt);
    const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
    const chase = !p.dead;
    const slow = e.type !== 'boss' && inMud(e.x, e.y) ? 0.6 : 1;

    if (e.type === 'boss') updateBoss(e, dt, d, ux, uy);
    else if (e.type === 'runner') {
      let [sx, sy] = steer(e, dt, d, ux, uy);
      if (e.los) { const w = Math.sin(e.t * 5 + e.wob) * 0.4; const tx = sx - sy * w, ty = sy + sx * w; const l = Math.hypot(tx, ty) || 1; sx = tx / l; sy = ty / l; }
      const s = chase ? e.speed * slow : 0;
      e.vx = damp(e.vx, sx * s, 5, dt); e.vy = damp(e.vy, sy * s, 5, dt);
    } else if (e.type === 'tank') {
      const [sx, sy] = steer(e, dt, d, ux, uy);
      const s = chase ? e.speed * slow : 0;
      e.vx = damp(e.vx, sx * s, 2, dt); e.vy = damp(e.vy, sy * s, 2, dt);
    } else if (e.type === 'shooter') {
      const [sx, sy] = steer(e, dt, d, ux, uy);
      let tx, ty;
      if (e.los) {
        e.flipT -= dt;
        if (e.flipT <= 0) { e.strafe *= -1; e.flipT = rand(2, 4); }
        const rad = d > e.prefer + 40 ? 1 : d < e.prefer - 40 ? -0.9 : 0, tan = e.strafe * 0.75;
        tx = ux * rad - uy * tan; ty = uy * rad + ux * tan;
      } else { tx = sx; ty = sy; }
      const tl = Math.hypot(tx, ty) || 1, s = chase ? e.speed * slow : 0;
      e.vx = damp(e.vx, tx / tl * s, 3, dt); e.vy = damp(e.vy, ty / tl * s, 3, dt);
      if (chase && e.spawnT >= 1) {
        e.fireT -= dt;
        if (e.fireT <= 0) {
          if (!e.los || d > 800) e.fireT = 0.3;          // hold fire until there's a clear shot
          else {
            const spd = 300 + Math.min(120, g.wave * 5), lead = Math.min(0.6, (g.wave - 1) * 0.05), tt = d / spd * lead;
            const a = Math.atan2(p.y + p.vy * tt - e.y, p.x + p.vx * tt - e.x);
            const shots = g.wave >= 8 ? 3 : 1;
            for (let i = 0; i < shots; i++) {
              const aa = a + (i - (shots - 1) / 2) * 0.2;
              enemyBullet(e.x + Math.cos(aa) * e.r, e.y + Math.sin(aa) * e.r, aa, spd, COL.spit, 6);
            }
            droplets(e.x + Math.cos(a) * e.r, e.y + Math.sin(a) * e.r, a, 0.5, 4, COL.spit, 40, 140);
            e.vx -= Math.cos(a) * 80; e.vy -= Math.sin(a) * 80;
            Sfx.spit();
            e.fireT = rand(1.7, 2.5) * Math.max(0.6, 1 - g.wave * 0.02);
          }
        }
      }
    }

    e.x += e.vx * dt; e.y += e.vy * dt;
    e.x = clamp(e.x, e.r, W - e.r); e.y = clamp(e.y, e.r, H - e.r);
    if (e.type === 'boss') collideBoss(e); else collideObstacles(e);

    // heading & leg animation
    const sp = Math.hypot(e.vx, e.vy);
    const faceA = (e.type === 'shooter' && e.los) || (e.type === 'boss' && e.pat !== 'charge') ? Math.atan2(dy, dx) : Math.atan2(e.vy, e.vx);

          e.vx -= nx * 260 / Math.sqrt(e.mass); e.vy -= ny * 260 / Math.sqrt(e.mass);
        }

  // enemy-enemy separation
  const es = g.enemies;
  for (let i = 0; i < es.length; i++) {
    const a = es[i];

}
function enemyBullet(x, y, a, spd, color, r) {

// ---------------------------------------------------------------------
//  BOSS — the Brood Queen
// ---------------------------------------------------------------------
function collideBoss(e) {
  // she bulldozes anything breakable; walls & rocks stop her charge cold
  let slammed = false;
  collideObstacles(e, ob => {
    if (ob.destructible) { destroyObstacle(ob); return false; }
    if (e.pat === 'charge' && e.sub === 1) slammed = true;
    return true;

}
function bossSlam(e) {
  addTrauma(0.5); Sfx.stomp();

  dust(e.x + e.cdx * e.r, e.y + e.cdy * e.r, 10, 18, 90);
  if (e.enraged) for (let i = 0; i < 10; i++) bossBullet(e, Math.atan2(-e.cdy, -e.cdx) + (i - 4.5) * 0.25, 200);
  e.sub = 2; e.pt = 0.6; e.vx *= 0.1; e.vy *= 0.1;
}
function bossToMove(e) { e.pat = 'move'; e.pt = e.enraged ? 1.0 : 1.7; }
function bossNext(e) {
  const order = ['spiral', 'charge', 'burst', 'aimed', 'summon'];
  let pat = order[e.cycle % order.length];
  e.cycle++;

  e.pat = pat; e.fireT = 0;

    case 'spiral': e.pt = e.enraged ? 3.6 : 3.0; break;
    case 'burst': e.sub = e.enraged ? 4 : 3; e.fireT = 0.3; break;
    case 'aimed': e.sub = e.enraged ? 6 : 4; e.fireT = 0.25; break;
    case 'charge': e.sub = 0; e.pt = 0.9; e.charges = e.enraged ? 3 : 2; break;
    case 'summon': {
      const n = e.enraged ? 5 : 3;
      for (let i = 0; i < n; i++) {
        const a = i * TAU / n + rand(-0.3, 0.3);
        let x = clamp(e.x + Math.cos(a) * 120, 40, W - 40), y = clamp(e.y + Math.sin(a) * 120, 40, H - 40);
        if (obstacleAt(x, y, 20)) { x = e.x; y = e.y; }
        addSpawn(i % 3 === 2 && g.wave >= 10 ? 'shooter' : 'runner', x, y, 0.8);

    }
  }
}
function bossBullet(e, a, spd) { enemyBullet(e.x + Math.cos(a) * e.r * 0.8, e.y + Math.sin(a) * e.r * 0.8, a, spd, COL.queenSpit, 8); }
function updateBoss(e, dt, d, ux, uy) {
  const p = g.p;
  if (!e.enraged && e.hp < e.maxHp * 0.5) {
    e.enraged = true;
    droplets(e.x, e.y, 0, Math.PI, 30, e.ichor, 100, 400);
    floatText(e.x, e.y - e.r - 20, 'ENRAGED', COL.red, 26, 1.4);
    addTrauma(0.6); g.hitStop = 0.08; Sfx.roar();
  }
  const rage = e.enraged ? 1.35 : 1;
  if (p.dead) { e.vx = damp(e.vx, 0, 3, dt); e.vy = damp(e.vy, 0, 3, dt); return; }
  if (e.spawnT < 1) return;
  e.pt -= dt;
  switch (e.pat) {
    case 'move': {
      const [sx, sy] = steer(e, dt, d, ux, uy);
      let tx, ty;
      if (e.los) { const rad = d > 330 ? 1 : -0.6; tx = ux * rad - uy * 0.6; ty = uy * rad + ux * 0.6; } else { tx = sx; ty = sy; }
      e.vx = damp(e.vx, tx * e.speed * rage, 2, dt); e.vy = damp(e.vy, ty * e.speed * rage, 2, dt);
      if (e.pt <= 0) bossNext(e);

    }
    case 'spiral': {
      e.vx = damp(e.vx, 0, 3, dt); e.vy = damp(e.vy, 0, 3, dt);
      e.fireT -= dt;
      while (e.fireT <= 0) {
        e.fireT += e.enraged ? 0.07 : 0.09;
        const arms = e.enraged ? 4 : 3;
        for (let i = 0; i < arms; i++) bossBullet(e, e.spin + i * TAU / arms, 220);
        Sfx.spit();
      }
      e.spin += dt * (e.enraged ? 2.4 : 1.9);
      if (e.pt <= 0) bossToMove(e);
      break;
    }
    case 'burst': {
      e.vx = damp(e.vx, 0, 4, dt); e.vy = damp(e.vy, 0, 4, dt);
      e.fireT -= dt;

    }
    case 'aimed': {

          for (let i = 0; i < n; i++) bossBullet(e, base + (i - (n - 1) / 2) * 0.14, 330);
          Sfx.spit();

      }
      break;
    }
    case 'charge': {
      if (e.sub === 0) {
        e.vx = damp(e.vx, 0, 6, dt); e.vy = damp(e.vy, 0, 6, dt);
        if (e.pt > 0.25) { e.cdx = ux; e.cdy = uy; }
        e.head = angLerp(e.head, Math.atan2(e.cdy, e.cdx), Math.min(1, dt * 10));
        if (Math.random() < 0.3) dust(e.x - e.cdx * e.r, e.y - e.cdy * e.r, 1, 10, 40);
        if (e.pt <= 0) { e.sub = 1; e.pt = 0.7; Sfx.roar(); addTrauma(0.25); }
      } else if (e.sub === 1) {
        const sp = 820 * (e.enraged ? 1.12 : 1);
        e.vx = e.cdx * sp; e.vy = e.cdy * sp;
        e.head = Math.atan2(e.cdy, e.cdx);
        if (Math.random() < 0.6) dust(e.x + rand(-20, 20), e.y + rand(-20, 20), 1, 14, 30);
        const hitWall = e.x <= e.r + 1 || e.x >= W - e.r - 1 || e.y <= e.r + 1 || e.y >= H - e.r - 1;

      } else {
        e.vx = damp(e.vx, 0, 6, dt); e.vy = damp(e.vy, 0, 6, dt);

      }

    }
    case 'summon': {
      e.vx = damp(e.vx, 0, 4, dt); e.vy = damp(e.vy, 0, 4, dt);

    }

}

// ---------------------------------------------------------------------
//  DAMAGE, KILLS, COMBO, EXPLOSIONS

function damageEnemy(e, dmg, nx, ny) {

  e.hp -= dmg;
  e.flash = e.type === 'boss' ? 0.035 : 0.07;

}
function killEnemy(e) {
  if (e.dead) return;

  g.kills++;
  if (g.comboT > 0) g.combo++; else g.combo = 1;
  g.comboT = COMBO_WINDOW;
  g.maxCombo = Math.max(g.maxCombo, g.combo);
  const mult = Math.min(8, 1 + Math.floor(g.combo / 2));   // 2 kills → x2, 4 → x3 … capped at x8
  if (mult > g.mult) Sfx.combo(mult);
  g.mult = mult;
  g.comboPulse = 1;
  const pts = e.score * mult;
  g.score += pts;
  floatText(e.x, e.y - e.r, '+' + pts, mult > 1 ? COL.amber : COL.ui, e.type === 'boss' ? 30 : 14 + Math.min(6, mult), e.type === 'boss' ? 2 : 0.8);

  if (e.type === 'boss') {
    for (let i = 0; i < 8; i++) {
      const x = e.x + rand(-60, 60), y = e.y + rand(-60, 60);
      stampSplat(x, y, e.ichor, rand(20, 40), 0.6);
      droplets(x, y, 0, Math.PI, 12, e.ichor, 100, 420);
      chunks(x, y, 5, '#3a1f30', 10, 380);
      chunks(x, y, 3, '#c9b79c', 7, 300);
    }
    dust(e.x, e.y, 20, 26, 160);
    shockRing(e.x, e.y, 220, 0.6);
    addTrauma(1); g.slowT = 1.4; g.slowScale = 0.25; g.bossesKilled++;
    Sfx.bossDeath();
    g.boss = null;
    for (const o of g.enemies) if (!o.dead) killEnemy(o);       // the brood dies with its queen
    for (const s of g.spawns) s.dead = true;
    for (const b of g.ebullets) { b.dead = true; droplets(b.x, b.y, 0, Math.PI, 2, b.color, 20, 80); }
    ['medkit', 'ammo', 'barrier'].forEach((k, i) => spawnPickup(e.x + Math.cos(i * 2.1) * 50, e.y + Math.sin(i * 2.1) * 50, k));
    showBanner('BOSS DOWN', '+' + pts.toLocaleString(), COL.amber, 2.6);
    return;
  }
  const big = e.type === 'tank' ? 1.6 : e.type === 'shooter' ? 1.1 : 0.8;
  stampSplat(e.x, e.y, e.ichor, 12 * big, 0.55);
  droplets(e.x, e.y, 0, Math.PI, Math.round(12 * big), e.ichor, 60, 300 * big);
  chunks(e.x, e.y, Math.round(4 * big), e.type === 'tank' ? '#2d3642' : e.type === 'shooter' ? '#4f5a1e' : '#4a1e14', 5 * big, 240);
  if (e.type === 'shooter') { flashLight(e.x, e.y, COL.spit, 50, 0.2); droplets(e.x, e.y, 0, Math.PI, 10, COL.spit, 80, 300); }
  dust(e.x, e.y, Math.round(2 * big), 10 * big, 40);
  addTrauma(e.type === 'tank' ? 0.3 : 0.1);
  if (e.type === 'tank') g.hitStop = Math.max(g.hitStop, 0.04);
  Sfx.squelch(e.type === 'tank' ? 1 : e.type === 'shooter' ? 0.5 : 0.2);
  const chance = e.type === 'tank' ? 0.18 : e.type === 'shooter' ? 0.1 : 0.05;
  if (Math.random() < chance && g.pickups.length < 6) spawnPickup(e.x, e.y, choosePickup());
}
function choosePickup() {
  const wh = g.p.hp < 50 ? 0.55 : 0.3, r = Math.random();
  return r < wh ? 'medkit' : r < wh + (1 - wh) * 0.55 ? 'ammo' : 'barrier';

function impactFx(ob, x, y, ang) {

function damageObstacle(ob, dmg) {

  flashLight(x, y, '#ff7a2a', 160, 0.45);

    const a = rand(0, TAU), s = rand(30, 220);

  }

  chunks(x, y, 5, '#2b2b2b', 6, 380);

  Sfx.explosion();
  if (!g) return;

    if (e.dead) continue;

      e.vx += nx * 500 * f / Math.sqrt(e.mass); e.vy += ny * 500 * f / Math.sqrt(e.mass);

  for (const ob of map.obs) {

}
function hurtPlayer(amount, sx, sy) {

}

function spawnPickup(x, y, type) {
  g.pickups.push({ type, x: clamp(x, 30, W - 30), y: clamp(y, 30, H - 30), r: 13, t: 0, life: 14, dead: false,
                   vx: rand(-90, 90), vy: rand(-90, 90), rot: rand(-0.4, 0.4) });
}
function updatePickups(dt) {
  const p = g.p;
  for (const k of g.pickups) {
    k.t += dt; k.life -= dt;
    if (k.life <= 0) { k.dead = true; dust(k.x, k.y, 3, 8, 30); continue; }
    k.vx *= Math.exp(-4 * dt); k.vy *= Math.exp(-4 * dt);
    if (!p.dead) {
      const dx = p.x - k.x, dy = p.y - k.y, d = Math.hypot(dx, dy) || 1;
      if (d < 90) { const pull = (1 - d / 90) * 700 * dt; k.vx += dx / d * pull; k.vy += dy / d * pull; }
      if (d < p.r + 16) { collect(k); continue; }
    }
    k.x = clamp(k.x + k.vx * dt, 20, W - 20); k.y = clamp(k.y + k.vy * dt, 20, H - 20);
    collideObstacles(k);
  }
}
function collect(k) {
  const p = g.p;
  k.dead = true;
  if (k.type === 'medkit') {
    const heal = Math.min(30, p.maxHp - p.hp);
    p.hp += heal;
    floatText(p.x, p.y - 30, heal > 0 ? '+' + Math.round(heal) + ' HP' : 'HP FULL', COL.medkit, 17);
  } else if (k.type === 'ammo') {
    p.rapid = 10;
    floatText(p.x, p.y - 30, 'RAPID FIRE 10s', COL.ammo, 17);
  } else {
    p.shield = 5;
    floatText(p.x, p.y - 30, 'BARRIER 5s', COL.barrier, 17);
  }
  dust(k.x, k.y, 3, 8, 40);
  Sfx.pickup(k.type);
}

function updatePlayer(dt) {
  const p = g.p;

  if (p.dead) return;

function updateGame(rdt) {

  else g.timeScale = damp(g.timeScale, 1, 6, rdt);

  if (g.hitStop > 0) { g.hitStop -= rdt; dt *= 0.05; }

  g.time += dt;
  for (const ob of map.obs) if (ob.hit > 0) ob.hit -= dt;
  updateField(dt, g.p.x, g.p.y);
  updatePlayer(dt);
  updateSpawns(dt);
  updateEnemies(dt);
  updateBullets(dt);
  for (const b of g.booms) { b.t -= dt; if (b.t <= 0) { b.dead = true; destroyObstacle(b.ob); } }
  compact(g.booms);
  compact(g.enemies);
  if (g.boss && g.boss.dead) g.boss = null;
  updatePickups(dt);
  compact(g.pickups);
  updateWaves(dt);
  updateFx(dt);
  fadeDecals(dt);
  for (const ob of map.obs)   // damaged fuel drums smoulder
    if (!ob.dead && ob.kind === 'barrel' && ob.hp < ob.maxHp && Math.random() < dt * 6) smoke(ob.cx, ob.cy, 1, '70,66,60', 8, 1, 15);

  if (g.comboT > 0) { g.comboT -= dt; if (g.comboT <= 0) { g.combo = 0; g.mult = 1; } }
  g.comboPulse = Math.max(0, g.comboPulse - rdt * 4);
  g.hurtFlash = Math.max(0, g.hurtFlash - rdt * 2.5);
  g.shownScore = g.shownScore < g.score ? Math.min(g.score, damp(g.shownScore, g.score, 10, rdt) + 1) : g.score;
  if (g.banner) { g.banner.t += rdt; if (g.banner.t > g.banner.dur) g.banner = null; }
  if (state === 'dying') { g.deathT -= rdt; if (g.deathT <= 0) gameOver(); }
}
function update(rdt) {
  globalT += rdt;
  mouse.wx = (mouse.x - view.ox) / view.scale;
  mouse.wy = (mouse.y - view.oy) / view.scale;
  mouse.kick = Math.max(0, mouse.kick - rdt * 6);
  if (state === 'playing' || state === 'dying') updateGame(rdt);
  else if (state === 'title') { updateTitle(rdt); updateFx(rdt); }
  else if (state === 'gameover') { g.overT += rdt; updateFx(rdt); g.shownScore = g.score; }

    ctx.beginPath(); ctx.moveTo(2, 0); ctx.lineTo(7 * s, -7 * s); ctx.lineTo(5 * s, 0); ctx.lineTo(7 * s, 7 * s); ctx.closePath(); ctx.fill();

// ---- enemies (top-down alien bugs)

    const x = cx + (i - 1.5) * colW, y = sy + 124 * s;

    text(k, x, y + 22 * s, 10 * s, COL.uiDim, 'center', 700, FONT, 2);
  });
  if (g.overT > 0.4) {
    const by = sy + 210 * s;
    button('REDEPLOY', cx, by, 260 * s, 54 * s, startGame, true);
    button('MAIN MENU', cx, by + 66 * s, 260 * s, 48 * s, toMenu, false);
    text('Enter / R to restart  ·  Esc for menu', cx, by + 114 * s, 12 * s, COL.uiDim, 'center', 600, FONT, 1);
  }
  ctx.globalAlpha = 1;
  endButtons();
}
function drawCursor() {
  const x = mouse.x, y = mouse.y;
  if (x < 0 || y < 0) return;
  const s = ui;
  const inGame = state === 'playing' && !buttonAt(x, y);
  ctx.save();
  if (inGame) {
    const hot = g && g.p.rapid > 0;
    const gap = (6 + mouse.kick * 6 + (hot ? 3 : 0)) * s, len = 7 * s;
    for (const [col, w] of [['rgba(0,0,0,0.7)', 4], [hot ? COL.tracerHot : '#f2ecd8', 2]]) {
      ctx.strokeStyle = col; ctx.lineWidth = w;
      ctx.beginPath();
      ctx.moveTo(x - gap - len, y); ctx.lineTo(x - gap, y); ctx.moveTo(x + gap, y); ctx.lineTo(x + gap + len, y);
      ctx.moveTo(x, y - gap - len); ctx.lineTo(x, y - gap); ctx.moveTo(x, y + gap); ctx.lineTo(x, y + gap + len);
      ctx.stroke();
    }
    ctx.fillStyle = '#f2ecd8'; ctx.fillRect(x - 1, y - 1, 2, 2);
  } else {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath(); ctx.moveTo(x + 1, y + 1); ctx.lineTo(x + 1, y + 19 * s); ctx.lineTo(x + 6 * s, y + 14 * s); ctx.lineTo(x + 13 * s, y + 14 * s); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f2ecd8';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 17 * s); ctx.lineTo(x + 5 * s, y + 12.5 * s); ctx.lineTo(x + 12 * s, y + 12.5 * s); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// =====================================================================
//  MAIN LOOP
// =====================================================================
let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let rdt = (now - lastT) / 1000;
  lastT = now;
  if (!(rdt > 0)) rdt = 0;
  rdt = Math.min(rdt, 0.05);   // clamp after tab switches / hitches
  update(rdt);
  render();
}
resize();
initTitle();
requestAnimationFrame(t => { lastT = t; frame(t); });

// Debug/test hook (used by automated smoke tests)
window.__holdout = {
  get state() { return state; },
  get game() { return g; },
  get map() { return map; },
  startGame, toMenu,
  skipToWave(n) { if (!g) return; g.enemies.length = 0; g.spawns.length = 0; g.queue.length = 0; g.ebullets.length = 0; g.boss = null; startWave(n); }
};
})();
</script>
