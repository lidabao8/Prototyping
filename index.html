<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>NEON SIEGE — Arena Survival</title>
<style>
  html, body { margin: 0; height: 100%; background: #04050b; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: none; touch-action: none;
           user-select: none; -webkit-user-select: none; outline: none; }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<script>
"use strict";
(() => {
// =====================================================================
//  CONSTANTS & UTILITIES
// =====================================================================
const W = 1600, H = 1000;                 // logical arena size (world units)
const TAU = Math.PI * 2;
const FONT = "'Segoe UI', 'Trebuchet MS', system-ui, -apple-system, Roboto, sans-serif";
const HS_KEY = 'neonSiege.highScore';
const COMBO_WINDOW = 2.0;
const C = {
  player: '#4ef2ff', pbullet: '#c8fbff', runner: '#ff4d6d', tank: '#ffb340',
  shooter: '#b86bff', boss: '#ff3df0', ebullet: '#ff8a3d', bbullet: '#ff4fd8',
  health: '#4dff88', rapid: '#ffe14d', shield: '#4db8ff', white: '#ffffff'
};
const BOSS_NAMES = ['THE WARDEN', 'HIVE TYRANT', 'NULL SOVEREIGN', 'THE ECLIPSE', 'OMEGA CORE'];

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
function compact(arr) {
  let j = 0;
  for (let i = 0; i < arr.length; i++) { const o = arr[i]; if (!o.dead) arr[j++] = o; }
  arr.length = j;
}
function loadHigh() { try { return parseInt(localStorage.getItem(HS_KEY), 10) || 0; } catch (e) { return 0; } }
function saveHigh(v) { try { localStorage.setItem(HS_KEY, String(v)); } catch (e) { /* storage unavailable */ } }

// =====================================================================
//  CANVAS / VIEW
// =====================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let cssW = 0, cssH = 0, dpr = 1, ui = 1;
const view = { scale: 1, ox: 0, oy: 0 };
let floorCanvas = null, bgCanvas = null;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cssW = Math.max(1, window.innerWidth);
  cssH = Math.max(1, window.innerHeight);
  canvas.width = Math.floor(cssW * dpr);
  canvas.height = Math.floor(cssH * dpr);
  view.scale = Math.min(cssW / W, cssH / H) * 0.97;
  view.ox = (cssW - W * view.scale) / 2;
  view.oy = (cssH - H * view.scale) / 2;
  ui = clamp(Math.min(cssW / 1100, cssH / 720), 0.55, 1.6);
  buildFloor();
  buildBackground();
}

function buildFloor() {
  const k = view.scale * dpr;
  floorCanvas = document.createElement('canvas');
  floorCanvas.width = Math.max(1, Math.ceil(W * k));
  floorCanvas.height = Math.max(1, Math.ceil(H * k));
  const f = floorCanvas.getContext('2d');
  f.scale(k, k);
  const gr = f.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, W * 0.65);
  gr.addColorStop(0, '#0d1226'); gr.addColorStop(1, '#070915');
  f.fillStyle = gr; f.fillRect(0, 0, W, H);
  f.lineWidth = 1;
  for (let x = 0; x <= W; x += 50) {
    f.strokeStyle = x % 250 === 0 ? 'rgba(90,140,255,0.13)' : 'rgba(90,140,255,0.05)';
    f.beginPath(); f.moveTo(x, 0); f.lineTo(x, H); f.stroke();
  }
  for (let y = 0; y <= H; y += 50) {
    f.strokeStyle = y % 250 === 0 ? 'rgba(90,140,255,0.13)' : 'rgba(90,140,255,0.05)';
    f.beginPath(); f.moveTo(0, y); f.lineTo(W, y); f.stroke();
  }
  // subtle center emblem
  f.strokeStyle = 'rgba(78,242,255,0.06)'; f.lineWidth = 3;
  f.beginPath(); f.arc(W / 2, H / 2, 160, 0, TAU); f.stroke();
  f.beginPath(); f.arc(W / 2, H / 2, 60, 0, TAU); f.stroke();
}

function buildBackground() {
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = canvas.width; bgCanvas.height = canvas.height;
  const b = bgCanvas.getContext('2d');
  b.fillStyle = '#04050b'; b.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
  const gr = b.createRadialGradient(bgCanvas.width / 2, bgCanvas.height / 2, 0,
    bgCanvas.width / 2, bgCanvas.height / 2, Math.max(bgCanvas.width, bgCanvas.height) * 0.7);
  gr.addColorStop(0, 'rgba(40,30,90,0.35)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  b.fillStyle = gr; b.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
  for (let i = 0; i < 160; i++) {
    b.fillStyle = `rgba(180,200,255,${rand(0.05, 0.35)})`;
    const s = rand(0.5, 1.8) * dpr;
    b.fillRect(rand(0, bgCanvas.width), rand(0, bgCanvas.height), s, s);
  }
}

// Glow sprite cache (cheap additive glows instead of shadowBlur)
const glowCache = {};
function glowSprite(color) {
  let c = glowCache[color];
  if (c) return c;
  c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d');
  const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, hexA(color, 1)); gr.addColorStop(0.2, hexA(color, 0.55));
  gr.addColorStop(0.5, hexA(color, 0.14)); gr.addColorStop(1, hexA(color, 0));
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
  return (glowCache[color] = c);
}
function drawGlow(color, x, y, r, alpha) {
  ctx.globalAlpha = alpha;
  ctx.drawImage(glowSprite(color), x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = 1;
}
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r); ctx.closePath();
}
function polygon(n, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = rot + i * TAU / n;
    if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath();
}

// =====================================================================
//  AUDIO (Web Audio API, fully synthesized)
// =====================================================================
const Sfx = (() => {
  let ac = null, master = null, noiseBuf = null, muted = false;
  const last = {};
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ac = new AC();
      master = ac.createGain(); master.gain.value = muted ? 0 : 0.55;
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 6;
      master.connect(comp); comp.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 1, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
  }
  const ok = () => ac && ac.state === 'running' && !muted;
  function throttle(name, gap) {
    const t = performance.now() / 1000;
    if (last[name] !== undefined && t - last[name] < gap) return false;
    last[name] = t; return true;
  }
  function tone({ type = 'square', f0 = 440, f1 = f0, dur = 0.1, vol = 0.2, delay = 0, attack = 0.005 }) {
    if (!ok()) return;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noise({ dur = 0.2, vol = 0.3, f0 = 2000, f1 = 200, type = 'lowpass', q = 0.8, delay = 0 }) {
    if (!ok()) return;
    const t = ac.currentTime + delay;
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    const off = Math.random() * 0.5;
    s.start(t, off, dur + 0.05);
  }
  return {
    init,
    get muted() { return muted; },
    toggleMute() {
      muted = !muted;
      if (master) master.gain.setTargetAtTime(muted ? 0 : 0.55, ac.currentTime, 0.02);
    },
    shoot(rapid) {
      if (!throttle('shoot', 0.03)) return;
      tone({ type: 'square', f0: rapid ? 1100 : 780, f1: rapid ? 480 : 230, dur: 0.07, vol: 0.06 });
      noise({ dur: 0.04, vol: 0.04, f0: 7000, f1: 2500, type: 'highpass' });
    },
    hit() {
      if (!throttle('hit', 0.035)) return;
      tone({ type: 'triangle', f0: 340, f1: 110, dur: 0.07, vol: 0.12 });
      noise({ dur: 0.05, vol: 0.07, f0: 3500, f1: 700 });
    },
    explode(size) {
      if (!throttle('explode', 0.03)) return;
      noise({ dur: 0.25 + 0.35 * size, vol: 0.22 + 0.14 * size, f0: 2200, f1: 70 });
      tone({ type: 'sine', f0: 170, f1: 38, dur: 0.25 + 0.3 * size, vol: 0.12 + 0.12 * size });
    },
    hurt() {
      tone({ type: 'sawtooth', f0: 240, f1: 55, dur: 0.32, vol: 0.18 });
      noise({ dur: 0.22, vol: 0.2, f0: 1400, f1: 150 });
    },
    block() {
      if (!throttle('block', 0.05)) return;
      tone({ type: 'sine', f0: 1500, f1: 700, dur: 0.12, vol: 0.09 });
    },
    pickup(kind) {
      const base = kind === 'health' ? [523, 659, 784] : kind === 'rapid' ? [660, 880, 1320] : [440, 660, 990];
      base.forEach((f, i) => tone({ type: 'square', f0: f, dur: 0.1, vol: 0.07, delay: i * 0.055 }));
      tone({ type: 'sine', f0: base[2] * 2, dur: 0.25, vol: 0.05, delay: 0.16 });
    },
    enemyShot() {
      if (!throttle('eshot', 0.05)) return;
      tone({ type: 'sawtooth', f0: 520, f1: 240, dur: 0.12, vol: 0.05 });
    },
    bossShot() {
      if (!throttle('bshot', 0.08)) return;
      tone({ type: 'triangle', f0: 320, f1: 180, dur: 0.09, vol: 0.06 });
    },
    spawn() {
      if (!throttle('spawn', 0.09)) return;
      tone({ type: 'sine', f0: 180, f1: 640, dur: 0.18, vol: 0.035 });
    },
    waveStart() { [392, 523, 659, 784].forEach((f, i) => tone({ type: 'triangle', f0: f, dur: 0.18, vol: 0.1, delay: i * 0.08 })); },
    waveClear() { [523, 659, 784, 1047].forEach((f, i) => tone({ type: 'square', f0: f, dur: 0.14, vol: 0.06, delay: i * 0.07 })); },
    bossAlarm() {
      for (let i = 0; i < 3; i++) {
        tone({ type: 'sawtooth', f0: 180, f1: 90, dur: 0.38, vol: 0.12, delay: i * 0.45 });
        tone({ type: 'square', f0: 90, f1: 45, dur: 0.38, vol: 0.06, delay: i * 0.45 });
      }
    },
    roar() {
      tone({ type: 'sawtooth', f0: 110, f1: 40, dur: 0.9, vol: 0.18 });
      noise({ dur: 0.8, vol: 0.18, f0: 800, f1: 100 });
    },
    dash() {
      noise({ dur: 0.45, vol: 0.16, f0: 400, f1: 3000, type: 'bandpass', q: 1.5 });
      tone({ type: 'sawtooth', f0: 90, f1: 260, dur: 0.35, vol: 0.08 });
    },
    combo(m) { tone({ type: 'square', f0: 420 + m * 95, f1: 520 + m * 110, dur: 0.11, vol: 0.06 }); },
    click() { tone({ type: 'square', f0: 950, dur: 0.035, vol: 0.04 }); },
    hover() { if (throttle('hover', 0.05)) tone({ type: 'sine', f0: 1400, dur: 0.03, vol: 0.025 }); },
    start() { [330, 440, 660, 880].forEach((f, i) => tone({ type: 'square', f0: f, dur: 0.12, vol: 0.06, delay: i * 0.06 })); },
    pause() { tone({ type: 'triangle', f0: 600, f1: 300, dur: 0.12, vol: 0.08 }); },
    gameOver() { [440, 349, 294, 220].forEach((f, i) => tone({ type: 'triangle', f0: f, f1: f * 0.98, dur: 0.35, vol: 0.12, delay: i * 0.22 })); },
    playerDeath() {
      noise({ dur: 1.2, vol: 0.35, f0: 2500, f1: 50 });
      tone({ type: 'sawtooth', f0: 320, f1: 30, dur: 1.2, vol: 0.18 });
    },
    bossDeath() {
      for (let i = 0; i < 5; i++) noise({ dur: 0.5, vol: 0.3, f0: 2000, f1: 60, delay: i * 0.13 });
      tone({ type: 'sine', f0: 120, f1: 25, dur: 1.6, vol: 0.3 });
    }
  };
})();

// =====================================================================
//  INPUT
// =====================================================================
const keys = {};
const mouse = { x: -100, y: -100, wx: W / 2, wy: H / 2, down: false, kick: 0 };
let buttons = [];          // rebuilt each frame by screen drawing
let hovered = null;

function keyDown(code) { return !!keys[code]; }

window.addEventListener('keydown', e => {
  Sfx.init();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.repeat) return;
  onKey(e.code);
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  mouse.down = false;
  if (state === 'playing') setPaused(true);
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'playing') setPaused(true); });

function updatePointer(e) { mouse.x = e.clientX; mouse.y = e.clientY; }
window.addEventListener('pointermove', updatePointer);
canvas.addEventListener('pointerdown', e => {
  Sfx.init();
  canvas.focus();
  updatePointer(e);
  if (e.button !== 0) return;
  const b = buttonAt(mouse.x, mouse.y);
  if (b) { Sfx.click(); b.action(); return; }
  mouse.down = true;
});
window.addEventListener('pointerup', e => { if (e.button === 0) mouse.down = false; });
window.addEventListener('pointercancel', () => { mouse.down = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('resize', resize);

function buttonAt(x, y) {
  for (const b of buttons) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b;
  return null;
}

function onKey(code) {
  if (code === 'KeyM') { Sfx.toggleMute(); return; }
  switch (state) {
    case 'title':
      if (code === 'Enter' || code === 'Space') startGame();
      break;
    case 'playing':
      if (code === 'KeyP' || code === 'Escape') setPaused(true);
      break;
    case 'paused':
      if (code === 'KeyP' || code === 'Escape' || code === 'Enter' || code === 'Space') setPaused(false);
      else if (code === 'KeyQ') toMenu();
      break;
    case 'gameover':
      if (g && g.overT < 0.6) break;   // avoid accidental instant restart
      if (code === 'Enter' || code === 'Space' || code === 'KeyR') startGame();
      else if (code === 'Escape') toMenu();
      break;
  }
}

// =====================================================================
//  GAME STATE
// =====================================================================
let state = 'title';     // title | playing | paused | dying | gameover
let g = null;            // current run
let highScore = loadHigh();
let trauma = 0;          // screen shake amount (0..1)
let globalT = 0;
const particles = [];
const texts = [];
const MAX_PARTICLES = 1400;

function makePlayer() {
  return { x: W / 2, y: H / 2, vx: 0, vy: 0, r: 16, hp: 100, maxHp: 100, hpTrail: 100,
           aim: 0, cool: 0.25, inv: 0, rapid: 0, shield: 0, kick: 0, flash: 0, dead: false, trailT: 0 };
}

function startGame() {
  Sfx.init();
  g = {
    p: makePlayer(), enemies: [], bullets: [], ebullets: [], pickups: [], spawns: [],
    wave: 0, waveState: 'break', breakT: 2.0, queue: [], spawnT: 0,
    score: 0, shownScore: 0, combo: 0, comboT: 0, maxCombo: 0, comboPulse: 0, mult: 1,
    kills: 0, time: 0, timeScale: 1, slowT: 0, slowScale: 1, hitStop: 0,
    hurtFlash: 0, deathT: 0, overT: 0, newRecord: false, banner: null, bossesKilled: 0
  };
  particles.length = 0; texts.length = 0; trauma = 0;
  mouse.down = false;
  showBanner('GET READY', 'Survive the siege', C.player);
  state = 'playing';
  Sfx.start();
}
function toMenu() { state = 'title'; g = null; particles.length = 0; texts.length = 0; trauma = 0; initDemo(); }
function setPaused(on) {
  if (on && state === 'playing') { state = 'paused'; mouse.down = false; Sfx.pause(); }
  else if (!on && state === 'paused') { state = 'playing'; Sfx.pause(); }
}
function showBanner(title, sub, color, dur = 2.4) { g.banner = { title, sub, color, t: 0, dur }; }
function addTrauma(v) { trauma = Math.min(1, trauma + v); }

// ---------------------------------------------------------------------
//  FX helpers
// ---------------------------------------------------------------------
function addParticle(o) {
  if (particles.length >= MAX_PARTICLES) particles[Math.floor(Math.random() * particles.length)] = o;
  else particles.push(o);
}
function spark(x, y, ang, spread, n, color, sp0, sp1, life = 0.35) {
  for (let i = 0; i < n; i++) {
    const a = ang + rand(-spread, spread), s = rand(sp0, sp1);
    addParticle({ kind: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(life * 0.6, life), max: life,
                  size: rand(1.5, 3), color, drag: 5 });
  }
}
function explosion(x, y, color, scale = 1) {
  addParticle({ kind: 'flash', x, y, vx: 0, vy: 0, life: 0.22, max: 0.22, size: 70 * scale, color: '#ffffff', drag: 0 });
  addParticle({ kind: 'flash', x, y, vx: 0, vy: 0, life: 0.4, max: 0.4, size: 110 * scale, color, drag: 0 });
  addParticle({ kind: 'ring', x, y, vx: 0, vy: 0, life: 0.45, max: 0.45, size: 90 * scale, color, drag: 0 });
  spark(x, y, 0, Math.PI, Math.round(16 * scale), color, 200, 650 * Math.sqrt(scale), 0.5);
  spark(x, y, 0, Math.PI, Math.round(6 * scale), '#ffffff', 150, 450, 0.3);
  for (let i = 0; i < Math.round(10 * scale); i++) {
    const a = rand(0, TAU), s = rand(40, 260);
    addParticle({ kind: 'dot', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.4, 0.9), max: 0.9,
                  size: rand(2, 5), color, drag: 3 });
  }
  for (let i = 0; i < Math.round(5 * scale); i++) {
    const a = rand(0, TAU), s = rand(80, 320);
    addParticle({ kind: 'debris', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.6, 1.1), max: 1.1,
                  size: rand(3, 7) * Math.sqrt(scale), color, drag: 2.5, rot: rand(0, TAU), vr: rand(-12, 12) });
  }
}
function floatText(x, y, text, color, size = 18, life = 0.9) {
  texts.push({ x, y, text, color, size, life, max: life, vy: -60 });
}
function updateFx(dt) {
  for (const p of particles) {
    p.life -= dt;
    if (p.life <= 0) { p.dead = true; continue; }
    if (p.drag) { const k = Math.exp(-p.drag * dt); p.vx *= k; p.vy *= k; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.vr) p.rot += p.vr * dt;
  }
  compact(particles);
  for (const t of texts) {
    t.life -= dt; t.y += t.vy * dt; t.vy *= Math.exp(-2 * dt);
    if (t.life <= 0) t.dead = true;
  }
  compact(texts);
}

// ---------------------------------------------------------------------
//  WAVES & SPAWNING  (smooth difficulty curve)
// ---------------------------------------------------------------------
const isBossWave = n => n % 5 === 0;
function waveCount(n) { return Math.floor(6 + 2.6 * (n - 1) + 0.1 * (n - 1) * (n - 1)); }
function spawnInterval(n) { return Math.max(0.28, 1.15 - 0.055 * (n - 1)); }
function maxAlive(n) { return Math.min(45, 8 + n * 2); }
function speedMul(n) { return 1 + Math.min(0.4, (n - 1) * 0.025); }

function buildWave(n) {
  const list = [];
  if (isBossWave(n)) {
    list.push('boss');
    const esc = 2 + Math.floor(n / 5) * 2;
    for (let i = 0; i < esc; i++) list.push(Math.random() < 0.6 ? 'runner' : 'shooter');
    return list;
  }
  const count = waveCount(n);
  const wr = 1;
  const ws = n >= 2 ? Math.min(0.55, 0.15 + (n - 2) * 0.08) : 0;
  const wt = n >= 3 ? Math.min(0.45, 0.12 + (n - 3) * 0.06) : 0;
  const tot = wr + ws + wt;
  for (let i = 0; i < count; i++) {
    const r = Math.random() * tot;
    list.push(r < wr ? 'runner' : r < wr + ws ? 'shooter' : 'tank');
  }
  // guarantee the new enemy type is introduced when it first appears
  if (n === 2) list[1] = 'shooter';
  if (n === 3) list[2] = 'tank';
  return list;
}

function startWave(n) {
  g.wave = n;
  g.queue = buildWave(n);
  g.waveState = 'active';
  g.spawnT = 0.6;
  if (isBossWave(n)) {
    const k = n / 5;
    showBanner('BOSS WAVE', BOSS_NAMES[(k - 1) % BOSS_NAMES.length] + ' APPROACHES', C.boss, 3);
    Sfx.bossAlarm();
    addTrauma(0.3);
  } else {
    showBanner('WAVE ' + n, waveSubtitle(n), '#9fdcff');
    Sfx.waveStart();
  }
}
function waveSubtitle(n) {
  if (n === 1) return 'Swarmers incoming';
  if (n === 2) return 'Warning: gunners detected';
  if (n === 3) return 'Warning: heavy armor detected';
  return waveCount(n) + ' hostiles';
}

function edgePoint(margin) {
  const side = randi(0, 3);
  if (side === 0) return { x: rand(margin, W - margin), y: margin };
  if (side === 1) return { x: W - margin, y: rand(margin, H - margin) };
  if (side === 2) return { x: rand(margin, W - margin), y: H - margin };
  return { x: margin, y: rand(margin, H - margin) };
}
function spawnPoint(minDist = 340) {
  const p = g.p;
  let best = null, bd = -1;
  for (let i = 0; i < 14; i++) {
    const pt = edgePoint(40);
    const d = Math.hypot(pt.x - p.x, pt.y - p.y);
    if (d > minDist) return pt;
    if (d > bd) { bd = d; best = pt; }
  }
  return best;
}
function addSpawn(type, x, y, dur) {
  g.spawns.push({ type, x, y, t: 0, dur, dead: false });
}

function updateWaves(dt) {
  if (g.waveState === 'break') {
    g.breakT -= dt;
    if (g.breakT <= 0 && !g.p.dead) startWave(g.wave + 1);
    return;
  }
  const n = g.wave;
  if (g.queue.length) {
    g.spawnT -= dt;
    const alive = g.enemies.length + g.spawns.length;
    if (g.spawnT <= 0 && alive < maxAlive(n)) {
      const type = g.queue.shift();
      if (type === 'boss') {
        // spawn at the edge midpoint farthest from the player
        const pts = [{ x: W / 2, y: 110 }, { x: W / 2, y: H - 110 }, { x: 110, y: H / 2 }, { x: W - 110, y: H / 2 }];
        pts.sort((a, b) => Math.hypot(b.x - g.p.x, b.y - g.p.y) - Math.hypot(a.x - g.p.x, a.y - g.p.y));
        addSpawn('boss', pts[0].x, pts[0].y, 1.8);
        g.spawnT = 3.5;
      } else {
        const pt = spawnPoint();
        addSpawn(type, pt.x, pt.y, 0.8);
        // runner packs from wave 3+
        let packed = 0;
        while (type === 'runner' && n >= 3 && g.queue[0] === 'runner' && packed < 3 && Math.random() < 0.55) {
          g.queue.shift(); packed++;
          addSpawn('runner', clamp(pt.x + rand(-60, 60), 30, W - 30), clamp(pt.y + rand(-60, 60), 30, H - 30), 0.8 + packed * 0.08);
        }
        g.spawnT = spawnInterval(n) * rand(0.6, 1.4) * (1 + packed * 0.6);
      }
    }
  }
  if (!g.queue.length && !g.spawns.length && !g.enemies.length) waveClear();
}

function waveClear() {
  const bonus = 250 * g.wave;
  g.score += bonus;
  const p = g.p;
  if (!p.dead) {
    const heal = Math.min(p.maxHp - p.hp, 10);
    p.hp += heal;
    if (heal > 0) floatText(p.x, p.y - 30, '+' + Math.round(heal) + ' HP', C.health, 18);
  }
  showBanner('WAVE ' + g.wave + ' CLEARED', '+' + bonus.toLocaleString() + ' BONUS', C.health, 2.4);
  g.waveState = 'break';
  g.breakT = 3.2;
  Sfx.waveClear();
}

// ---------------------------------------------------------------------
//  ENEMIES
// ---------------------------------------------------------------------
function createEnemy(type, x, y) {
  const n = g.wave, sm = speedMul(n);
  const base = { type, x, y, vx: 0, vy: 0, flash: 0, t: 0, rot: rand(0, TAU), spawnT: 0, shieldHitT: 0, dead: false };
  let e;
  switch (type) {
    case 'runner':
      e = Object.assign(base, { r: 13, hp: 1 + Math.floor((n - 1) / 7), speed: 205 * sm * rand(0.92, 1.08), dmg: 12,
        score: 100, color: C.runner, mass: 1, wob: rand(0, TAU) });
      break;
    case 'tank':
      e = Object.assign(base, { r: 28, hp: 7 + Math.floor(n * 0.7), speed: 62 * sm, dmg: 25, score: 300, color: C.tank, mass: 5 });
      break;
    case 'shooter':
      e = Object.assign(base, { r: 17, hp: 3 + Math.floor(n / 4), speed: 125 * sm, dmg: 10, score: 200, color: C.shooter,
        mass: 1.6, fireT: rand(1.2, 2.2), strafe: Math.random() < 0.5 ? 1 : -1, flipT: rand(2, 4), prefer: rand(260, 360) });
      break;
    case 'boss': {
      const k = Math.max(1, Math.round(n / 5));
      const hp = 140 + 90 * (k - 1);
      e = Object.assign(base, { r: 56, hp, speed: 85 + 8 * k, dmg: 30, score: 5000 * k, color: C.boss, mass: 60, k,
        name: BOSS_NAMES[(k - 1) % BOSS_NAMES.length], pat: 'move', pt: 2.2, cycle: 0, fireT: 0, spin: 0, sub: 0,
        cdx: 0, cdy: 0, charges: 0, enraged: false });
      g.boss = e;
      Sfx.roar(); addTrauma(0.7);
      break;
    }
  }
  e.maxHp = e.hp;
  return e;
}

function updateEnemies(dt) {
  const p = g.p;
  for (const e of g.enemies) {
    e.t += dt;
    e.flash = Math.max(0, e.flash - dt);
    e.spawnT = Math.min(1, e.spawnT + dt * 3.5);
    e.shieldHitT = Math.max(0, e.shieldHitT - dt);
    let dx = p.x - e.x, dy = p.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    const ux = dx / d, uy = dy / d;
    const chase = !p.dead;

    if (e.type === 'boss') { updateBoss(e, dt, d, ux, uy); }
    else if (e.type === 'runner') {
      const w = Math.sin(e.t * 5 + e.wob) * 0.45;
      let tx = ux - uy * w, ty = uy + ux * w;
      const tl = Math.hypot(tx, ty) || 1;
      const s = chase ? e.speed : 0;
      e.vx = damp(e.vx, tx / tl * s, 4, dt); e.vy = damp(e.vy, ty / tl * s, 4, dt);
    } else if (e.type === 'tank') {
      const s = chase ? e.speed : 0;
      e.vx = damp(e.vx, ux * s, 2, dt); e.vy = damp(e.vy, uy * s, 2, dt);
      e.rot += dt * 0.6;
    } else if (e.type === 'shooter') {
      e.flipT -= dt;
      if (e.flipT <= 0) { e.strafe *= -1; e.flipT = rand(2, 4); }
      const rad = d > e.prefer + 40 ? 1 : d < e.prefer - 40 ? -0.9 : 0;
      const tan = e.strafe * 0.75;
      let tx = ux * rad - uy * tan, ty = uy * rad + ux * tan;
      const tl = Math.hypot(tx, ty) || 1;
      const s = chase ? e.speed : 0;
      e.vx = damp(e.vx, tx / tl * s, 3, dt); e.vy = damp(e.vy, ty / tl * s, 3, dt);
      e.rot += dt * 2.2;
      if (chase && e.spawnT >= 1) {
        e.fireT -= dt;
        if (e.fireT <= 0) {
          const spd = 290 + Math.min(120, g.wave * 5);
          const lead = Math.min(0.6, (g.wave - 1) * 0.05);
          const tt = d / spd * lead;
          const a = Math.atan2(p.y + p.vy * tt - e.y, p.x + p.vx * tt - e.x);
          const shots = g.wave >= 8 ? 3 : 1;
          for (let i = 0; i < shots; i++) {
            const aa = a + (i - (shots - 1) / 2) * 0.2;
            enemyBullet(e.x + Math.cos(aa) * e.r, e.y + Math.sin(aa) * e.r, aa, spd, C.ebullet, 6);
          }
          spark(e.x + Math.cos(a) * e.r, e.y + Math.sin(a) * e.r, a, 0.5, 5, C.ebullet, 100, 300, 0.2);
          e.vx -= Math.cos(a) * 80; e.vy -= Math.sin(a) * 80;
          Sfx.enemyShot();
          e.fireT = rand(1.7, 2.5) * Math.max(0.6, 1 - g.wave * 0.02);
        }
      }
    }

    e.x += e.vx * dt; e.y += e.vy * dt;
    e.x = clamp(e.x, e.r, W - e.r); e.y = clamp(e.y, e.r, H - e.r);

    // contact with player
    if (!p.dead && e.spawnT > 0.5) {
      const cx = p.x - e.x, cy = p.y - e.y, cd = Math.hypot(cx, cy) || 1, min = e.r + p.r;
      if (cd < min) {
        const nx = cx / cd, ny = cy / cd;
        if (p.shield > 0) {
          e.vx -= nx * 600 / Math.sqrt(e.mass); e.vy -= ny * 600 / Math.sqrt(e.mass);
          if (e.shieldHitT <= 0) {
            e.shieldHitT = 0.25;
            spark(p.x - nx * p.r * 1.6, p.y - ny * p.r * 1.6, Math.atan2(-ny, -nx), 0.9, 8, C.shield, 150, 400);
            Sfx.block();
            damageEnemy(e, 1, -nx, -ny);
          }
        } else {
          hurtPlayer(e.type === 'boss' && e.pat === 'charge' && e.sub === 1 ? 38 : e.dmg, e.x, e.y);
          e.vx -= nx * 260 / Math.sqrt(e.mass); e.vy -= ny * 260 / Math.sqrt(e.mass);
        }
        // positional separation (player is lighter than everything)
        const ov = min - cd;
        if (e.type === 'boss') { p.x += nx * ov; p.y += ny * ov; }
        else { e.x -= nx * ov * 0.5; e.y -= ny * ov * 0.5; p.x += nx * ov * 0.5; p.y += ny * ov * 0.5; }
      }
    }
  }
  // enemy-enemy separation (soft)
  const es = g.enemies;
  for (let i = 0; i < es.length; i++) {
    const a = es[i];
    for (let j = i + 1; j < es.length; j++) {
      const b = es[j];
      const dx = b.x - a.x, dy = b.y - a.y, min = a.r + b.r;
      const d2 = dx * dx + dy * dy;
      if (d2 < min * min && d2 > 0.0001) {
        const d = Math.sqrt(d2), ov = (min - d) / d;
        const wa = b.mass / (a.mass + b.mass), wb = 1 - wa;
        a.x -= dx * ov * wa * 0.5; a.y -= dy * ov * wa * 0.5;
        b.x += dx * ov * wb * 0.5; b.y += dy * ov * wb * 0.5;
      }
    }
  }
}

function enemyBullet(x, y, a, spd, color, r) {
  g.ebullets.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r, life: 7, color, dead: false });
}

// ---------------------------------------------------------------------
//  BOSS
// ---------------------------------------------------------------------
function bossToMove(e) { e.pat = 'move'; e.pt = e.enraged ? 1.0 : 1.7; }
function bossNext(e) {
  const order = ['spiral', 'charge', 'burst', 'aimed', 'summon'];
  let pat = order[e.cycle % order.length];
  e.cycle++;
  if (pat === 'summon' && g.enemies.length + g.spawns.length > 9) pat = 'aimed';
  e.pat = pat; e.fireT = 0;
  switch (pat) {
    case 'spiral': e.pt = e.enraged ? 3.6 : 3.0; break;
    case 'burst': e.sub = e.enraged ? 4 : 3; e.fireT = 0.3; break;
    case 'aimed': e.sub = e.enraged ? 6 : 4; e.fireT = 0.25; break;
    case 'charge': e.sub = 0; e.pt = 0.9; e.charges = e.enraged ? 3 : 2; break;
    case 'summon': {
      const n = e.enraged ? 5 : 3;
      for (let i = 0; i < n; i++) {
        const a = i * TAU / n + rand(-0.3, 0.3);
        addSpawn(i % 3 === 2 && g.wave >= 10 ? 'shooter' : 'runner',
          clamp(e.x + Math.cos(a) * 120, 40, W - 40), clamp(e.y + Math.sin(a) * 120, 40, H - 40), 0.7);
      }
      e.pt = 1.0;
      Sfx.roar();
      break;
    }
  }
}
function bossBullet(e, a, spd) {
  enemyBullet(e.x + Math.cos(a) * e.r * 0.8, e.y + Math.sin(a) * e.r * 0.8, a, spd, C.bbullet, 8);
}
function updateBoss(e, dt, d, ux, uy) {
  const p = g.p;
  if (!e.enraged && e.hp < e.maxHp * 0.5) {
    e.enraged = true;
    explosion(e.x, e.y, '#ff3355', 1.6);
    floatText(e.x, e.y - e.r - 20, 'ENRAGED!', '#ff3355', 28, 1.4);
    addTrauma(0.6); g.hitStop = 0.08; Sfx.roar();
  }
  const rage = e.enraged ? 1.35 : 1;
  e.rot += dt * (e.pat === 'spiral' ? 3 : 0.8) * rage;
  if (p.dead) { e.vx = damp(e.vx, 0, 3, dt); e.vy = damp(e.vy, 0, 3, dt); return; }
  if (e.spawnT < 1) return;
  e.pt -= dt;
  switch (e.pat) {
    case 'move': {
      const want = 330, rad = d > want ? 1 : -0.6;
      const tx = ux * rad - uy * 0.6, ty = uy * rad + ux * 0.6;
      e.vx = damp(e.vx, tx * e.speed * rage, 2, dt); e.vy = damp(e.vy, ty * e.speed * rage, 2, dt);
      if (e.pt <= 0) bossNext(e);
      break;
    }
    case 'spiral': {
      e.vx = damp(e.vx, 0, 3, dt); e.vy = damp(e.vy, 0, 3, dt);
      e.fireT -= dt;
      while (e.fireT <= 0) {
        e.fireT += e.enraged ? 0.07 : 0.09;
        const arms = e.enraged ? 4 : 3;
        for (let i = 0; i < arms; i++) bossBullet(e, e.spin + i * TAU / arms, 220);
        Sfx.bossShot();
      }
      e.spin += dt * (e.enraged ? 2.4 : 1.9);
      if (e.pt <= 0) bossToMove(e);
      break;
    }
    case 'burst': {
      e.vx = damp(e.vx, 0, 4, dt); e.vy = damp(e.vy, 0, 4, dt);
      e.fireT -= dt;
      if (e.fireT <= 0) {
        if (e.sub > 0) {
          e.sub--;
          e.fireT = 0.55 / rage;
          const n = e.enraged ? 22 : 16, off = (e.sub % 2) * Math.PI / n + e.rot;
          for (let i = 0; i < n; i++) bossBullet(e, off + i * TAU / n, 240);
          addParticle({ kind: 'ring', x: e.x, y: e.y, vx: 0, vy: 0, life: 0.35, max: 0.35, size: 140, color: C.bbullet, drag: 0 });
          addTrauma(0.12); Sfx.bossShot(); Sfx.enemyShot();
        } else bossToMove(e);
      }
      break;
    }
    case 'aimed': {
      e.vx = damp(e.vx, ux * 40, 3, dt); e.vy = damp(e.vy, uy * 40, 3, dt);
      e.fireT -= dt;
      if (e.fireT <= 0) {
        if (e.sub > 0) {
          e.sub--;
          e.fireT = 0.38 / rage;
          const base = Math.atan2(p.y - e.y, p.x - e.x), n = e.enraged ? 7 : 5;
          for (let i = 0; i < n; i++) bossBullet(e, base + (i - (n - 1) / 2) * 0.14, 330);
          Sfx.enemyShot();
        } else bossToMove(e);
      }
      break;
    }
    case 'charge': {
      if (e.sub === 0) {               // wind-up: track the player, then lock
        e.vx = damp(e.vx, 0, 6, dt); e.vy = damp(e.vy, 0, 6, dt);
        if (e.pt > 0.25) { e.cdx = ux; e.cdy = uy; }
        if (Math.random() < 0.5) addTrauma(0.01);
        if (e.pt <= 0) { e.sub = 1; e.pt = 0.7; Sfx.dash(); addTrauma(0.25); }
      } else if (e.sub === 1) {        // dash
        const sp = 820 * (e.enraged ? 1.12 : 1);
        e.vx = e.cdx * sp; e.vy = e.cdy * sp;
        if (Math.random() < 0.8) addParticle({ kind: 'dot', x: e.x + rand(-20, 20), y: e.y + rand(-20, 20), vx: -e.vx * 0.2, vy: -e.vy * 0.2,
          life: 0.4, max: 0.4, size: rand(4, 8), color: C.boss, drag: 3 });
        const hitWall = e.x <= e.r + 1 || e.x >= W - e.r - 1 || e.y <= e.r + 1 || e.y >= H - e.r - 1;
        if (hitWall || e.pt <= 0) {
          if (hitWall) {
            addTrauma(0.45); Sfx.explode(0.8);
            spark(e.x + e.cdx * e.r, e.y + e.cdy * e.r, Math.atan2(-e.cdy, -e.cdx), 1.2, 20, '#ffffff', 200, 600);
            if (e.enraged) for (let i = 0; i < 10; i++) bossBullet(e, Math.atan2(-e.cdy, -e.cdx) + (i - 4.5) * 0.25, 200);
          }
          e.sub = 2; e.pt = 0.55; e.vx *= 0.15; e.vy *= 0.15;
        }
      } else {                          // recover
        e.vx = damp(e.vx, 0, 6, dt); e.vy = damp(e.vy, 0, 6, dt);
        if (e.pt <= 0) {
          e.charges--;
          if (e.charges > 0) { e.sub = 0; e.pt = 0.6; } else bossToMove(e);
        }
      }
      break;
    }
    case 'summon': {
      e.vx = damp(e.vx, 0, 4, dt); e.vy = damp(e.vy, 0, 4, dt);
      if (e.pt <= 0) bossToMove(e);
      break;
    }
  }
}

// ---------------------------------------------------------------------
//  DAMAGE, KILLS, COMBO
// ---------------------------------------------------------------------
function damageEnemy(e, dmg, nx, ny) {
  if (e.dead) return;
  e.hp -= dmg;
  e.flash = 0.08;
  e.vx += nx * 160 / e.mass; e.vy += ny * 160 / e.mass;
  if (e.hp <= 0) killEnemy(e);
  else Sfx.hit();
}
function killEnemy(e) {
  if (e.dead) return;
  e.dead = true;
  g.kills++;
  if (g.comboT > 0) g.combo++; else g.combo = 1;
  g.comboT = COMBO_WINDOW;
  g.maxCombo = Math.max(g.maxCombo, g.combo);
  const mult = Math.min(8, 1 + Math.floor(g.combo / 2));   // 2 kills → x2, 4 → x3 … capped at x8
  if (mult > g.mult) { Sfx.combo(mult); floatText(g.p.x, g.p.y - 40, 'x' + mult + ' COMBO!', C.rapid, 22, 1.0); }
  g.mult = mult;
  g.comboPulse = 1;
  const pts = e.score * mult;
  g.score += pts;
  floatText(e.x, e.y - e.r, '+' + pts, mult > 1 ? C.rapid : '#ffffff', e.type === 'boss' ? 34 : 16 + Math.min(8, mult), e.type === 'boss' ? 2 : 0.8);

  if (e.type === 'boss') {
    explosion(e.x, e.y, C.boss, 3.2);
    for (let i = 0; i < 6; i++) explosion(e.x + rand(-80, 80), e.y + rand(-80, 80), pick([C.boss, '#ffffff', C.rapid]), 1.2);
    addTrauma(1); g.slowT = 1.4; g.slowScale = 0.25; g.bossesKilled++;
    Sfx.bossDeath();
    g.boss = null;
    for (const o of g.enemies) if (!o.dead) killEnemy(o);     // minions collapse with their master
    for (const s of g.spawns) s.dead = true;
    for (const b of g.ebullets) { b.dead = true; spark(b.x, b.y, 0, Math.PI, 2, b.color, 50, 150, 0.3); }
    for (let i = 0; i < 3; i++) spawnPickup(e.x + rand(-60, 60), e.y + rand(-60, 60), ['health', 'rapid', 'shield'][i]);
    showBanner('BOSS DEFEATED', '+' + pts.toLocaleString(), C.rapid, 2.6);
    return;
  }
  const scale = e.type === 'tank' ? 1.5 : e.type === 'shooter' ? 1.05 : 0.8;
  explosion(e.x, e.y, e.color, scale);
  addTrauma(e.type === 'tank' ? 0.3 : 0.12);
  if (e.type === 'tank') g.hitStop = Math.max(g.hitStop, 0.04);
  Sfx.explode(e.type === 'tank' ? 1 : 0.4);
  const chance = e.type === 'tank' ? 0.2 : e.type === 'shooter' ? 0.11 : 0.055;
  if (Math.random() < chance && g.pickups.length < 6) spawnPickup(e.x, e.y, choosePickup());
}
function choosePickup() {
  const wh = g.p.hp < 50 ? 0.55 : 0.3;
  const r = Math.random();
  return r < wh ? 'health' : r < wh + (1 - wh) * 0.55 ? 'rapid' : 'shield';
}

function hurtPlayer(amount, sx, sy) {
  const p = g.p;
  if (p.dead || p.inv > 0) return false;
  if (p.shield > 0) { Sfx.block(); return false; }
  p.hp -= amount;
  p.inv = 0.75; p.flash = 0.12;
  g.hurtFlash = 1;
  addTrauma(0.4 + amount / 60);
  const dx = p.x - sx, dy = p.y - sy, d = Math.hypot(dx, dy) || 1;
  p.vx += dx / d * 420; p.vy += dy / d * 420;
  spark(p.x, p.y, Math.atan2(dy, dx), 1.0, 14, '#ff5a6e', 150, 450);
  floatText(p.x, p.y - 26, '-' + amount, '#ff5a6e', 20);
  Sfx.hurt();
  g.hitStop = Math.max(g.hitStop, 0.05);
  if (p.hp <= 0) { p.hp = 0; killPlayer(); }
  return true;
}
function killPlayer() {
  const p = g.p;
  p.dead = true;
  state = 'dying';
  g.deathT = 2.0;
  g.slowT = 1.6; g.slowScale = 0.3;
  explosion(p.x, p.y, C.player, 2.6);
  explosion(p.x, p.y, '#ffffff', 1.2);
  addTrauma(1);
  mouse.down = false;
  Sfx.playerDeath();
}
function gameOver() {
  state = 'gameover';
  g.overT = 0;
  if (g.score > highScore) { highScore = g.score; saveHigh(highScore); g.newRecord = true; }
  Sfx.gameOver();
}

// ---------------------------------------------------------------------
//  PICKUPS
// ---------------------------------------------------------------------
function spawnPickup(x, y, type) {
  g.pickups.push({ type, x: clamp(x, 30, W - 30), y: clamp(y, 30, H - 30), t: 0, life: 12, dead: false,
                   vx: rand(-80, 80), vy: rand(-80, 80) });
}
function updatePickups(dt) {
  const p = g.p;
  for (const k of g.pickups) {
    k.t += dt; k.life -= dt;
    if (k.life <= 0) { k.dead = true; spark(k.x, k.y, 0, Math.PI, 6, C[k.type], 40, 120, 0.3); continue; }
    k.vx *= Math.exp(-4 * dt); k.vy *= Math.exp(-4 * dt);
    if (!p.dead) {
      const dx = p.x - k.x, dy = p.y - k.y, d = Math.hypot(dx, dy) || 1;
      if (d < 120) { const pull = (1 - d / 120) * 900 * dt; k.vx += dx / d * pull; k.vy += dy / d * pull; }
      if (d < p.r + 18) { collect(k); continue; }
    }
    k.x = clamp(k.x + k.vx * dt, 20, W - 20); k.y = clamp(k.y + k.vy * dt, 20, H - 20);
  }
}
function collect(k) {
  const p = g.p;
  k.dead = true;
  const col = C[k.type];
  if (k.type === 'health') {
    const heal = Math.min(30, p.maxHp - p.hp);
    p.hp += heal;
    floatText(p.x, p.y - 30, heal > 0 ? '+' + Math.round(heal) + ' HP' : 'MAX HP', col, 20);
  } else if (k.type === 'rapid') {
    p.rapid = 10;
    floatText(p.x, p.y - 30, 'RAPID FIRE!', col, 22);
  } else {
    p.shield = 5;
    floatText(p.x, p.y - 30, 'SHIELD!', col, 22);
  }
  addParticle({ kind: 'ring', x: p.x, y: p.y, vx: 0, vy: 0, life: 0.45, max: 0.45, size: 70, color: col, drag: 0 });
  spark(k.x, k.y, 0, Math.PI, 14, col, 100, 350, 0.4);
  Sfx.pickup(k.type);
}

// ---------------------------------------------------------------------
//  PLAYER & BULLETS
// ---------------------------------------------------------------------
function updatePlayer(dt) {
  const p = g.p;
  p.hpTrail = p.hpTrail > p.hp ? damp(p.hpTrail, p.hp, 3, dt) : p.hp;
  if (p.dead) return;
  let ix = (keyDown('KeyD') || keyDown('ArrowRight') ? 1 : 0) - (keyDown('KeyA') || keyDown('ArrowLeft') ? 1 : 0);
  let iy = (keyDown('KeyS') || keyDown('ArrowDown') ? 1 : 0) - (keyDown('KeyW') || keyDown('ArrowUp') ? 1 : 0);
  const il = Math.hypot(ix, iy);
  if (il > 0) { ix /= il; iy /= il; }
  const speed = 330;
  p.vx = damp(p.vx, ix * speed, 11, dt); p.vy = damp(p.vy, iy * speed, 11, dt);
  p.x = clamp(p.x + p.vx * dt, p.r, W - p.r); p.y = clamp(p.y + p.vy * dt, p.r, H - p.r);
  p.aim = Math.atan2(mouse.wy - p.y, mouse.wx - p.x);
  p.inv = Math.max(0, p.inv - dt);
  p.flash = Math.max(0, p.flash - dt);
  p.kick = Math.max(0, p.kick - dt * 8);
  if (p.rapid > 0) p.rapid = Math.max(0, p.rapid - dt);
  if (p.shield > 0) p.shield = Math.max(0, p.shield - dt);

  // engine trail
  p.trailT -= dt;
  if (il > 0 && p.trailT <= 0) {
    p.trailT = 0.025;
    const a = Math.atan2(-iy, -ix) + rand(-0.4, 0.4);
    addParticle({ kind: 'dot', x: p.x - ix * p.r, y: p.y - iy * p.r, vx: Math.cos(a) * 120 + p.vx * 0.2, vy: Math.sin(a) * 120 + p.vy * 0.2,
                  life: 0.3, max: 0.3, size: rand(2, 4), color: p.rapid > 0 ? C.rapid : C.player, drag: 4 });
  }

  // shooting
  p.cool -= dt;
  if (mouse.down && p.cool <= 0) {
    const rate = p.rapid > 0 ? 0.06 : 0.13;
    p.cool = Math.max(p.cool + rate, rate * 0.5);
    shoot();
  }
  if (!mouse.down && p.cool < 0) p.cool = 0;
}
function shoot() {
  const p = g.p, rapid = p.rapid > 0;
  const spread = rapid ? 0.07 : 0.03;
  const a = p.aim + rand(-spread, spread);
  const mx = p.x + Math.cos(p.aim) * (p.r + 14), my = p.y + Math.sin(p.aim) * (p.r + 14);
  const spd = 980;
  g.bullets.push({ x: mx, y: my, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: 5, life: 1.2, dmg: 1,
                   color: rapid ? C.rapid : C.pbullet, dead: false });
  p.kick = 1;
  p.vx -= Math.cos(p.aim) * 22; p.vy -= Math.sin(p.aim) * 22;
  mouse.kick = 1;
  addParticle({ kind: 'flash', x: mx, y: my, vx: 0, vy: 0, life: 0.06, max: 0.06, size: 26, color: rapid ? C.rapid : C.player, drag: 0 });
  spark(mx, my, p.aim, 0.35, 2, rapid ? C.rapid : C.player, 200, 450, 0.12);
  addTrauma(0.012);
  Sfx.shoot(rapid);
}
function updateBullets(dt) {
  for (const b of g.bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0) { b.dead = true; continue; }
    if (b.x < 0 || b.x > W || b.y < 0 || b.y > H) {
      b.dead = true;
      spark(clamp(b.x, 0, W), clamp(b.y, 0, H), Math.atan2(-b.vy, -b.vx), 0.8, 4, b.color, 80, 260, 0.25);
      continue;
    }
    for (const e of g.enemies) {
      if (e.dead || e.spawnT < 0.3) continue;
      const dx = e.x - b.x, dy = e.y - b.y, rr = e.r + b.r;
      if (dx * dx + dy * dy < rr * rr) {
        b.dead = true;
        const sp = Math.hypot(b.vx, b.vy);
        spark(b.x, b.y, Math.atan2(-b.vy, -b.vx), 0.9, 5, e.color, 100, 380, 0.25);
        spark(b.x, b.y, Math.atan2(-b.vy, -b.vx), 0.6, 2, '#ffffff', 100, 300, 0.18);
        damageEnemy(e, b.dmg, b.vx / sp, b.vy / sp);
        break;
      }
    }
  }
  compact(g.bullets);

  const p = g.p;
  for (const b of g.ebullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < -10 || b.x > W + 10 || b.y < -10 || b.y > H + 10) { b.dead = true; continue; }
    if (p.dead) continue;
    const dx = p.x - b.x, dy = p.y - b.y;
    const hitR = p.shield > 0 ? p.r * 1.9 + b.r : p.r * 0.8 + b.r;   // forgiving hitbox
    if (dx * dx + dy * dy < hitR * hitR) {
      b.dead = true;
      if (p.shield > 0) { spark(b.x, b.y, Math.atan2(-dy, -dx), 0.8, 6, C.shield, 100, 320); Sfx.block(); }
      else hurtPlayer(b.r >= 8 ? 14 : 10, b.x, b.y);
    }
  }
  compact(g.ebullets);
}

function updateSpawns(dt) {
  for (const s of g.spawns) {
    s.t += dt;
    if (s.t >= s.dur) {
      s.dead = true;
      const e = createEnemy(s.type, s.x, s.y);
      g.enemies.push(e);
      addParticle({ kind: 'ring', x: s.x, y: s.y, vx: 0, vy: 0, life: 0.35, max: 0.35, size: s.type === 'boss' ? 200 : 50,
                    color: e.color, drag: 0 });
      spark(s.x, s.y, 0, Math.PI, s.type === 'boss' ? 40 : 8, e.color, 80, s.type === 'boss' ? 600 : 220, 0.4);
      Sfx.spawn();
    }
  }
  compact(g.spawns);
}

// =====================================================================
//  MAIN UPDATE
// =====================================================================
function updateGame(rdt) {
  // time scaling: slow-mo & hit-stop
  if (g.slowT > 0) { g.slowT -= rdt; g.timeScale = g.slowScale; }
  else g.timeScale = damp(g.timeScale, 1, 6, rdt);
  let dt = rdt * g.timeScale;
  if (g.hitStop > 0) { g.hitStop -= rdt; dt *= 0.05; }

  g.time += dt;
  updatePlayer(dt);
  updateSpawns(dt);
  updateEnemies(dt);
  updateBullets(dt);
  compact(g.enemies);
  if (g.boss && g.boss.dead) g.boss = null;
  updatePickups(dt);
  compact(g.pickups);
  updateWaves(dt);
  updateFx(dt);

  if (g.comboT > 0) { g.comboT -= dt; if (g.comboT <= 0) { g.combo = 0; g.mult = 1; } }
  g.comboPulse = Math.max(0, g.comboPulse - rdt * 4);
  g.hurtFlash = Math.max(0, g.hurtFlash - rdt * 2.5);
  g.shownScore = g.shownScore < g.score ? Math.min(g.score, damp(g.shownScore, g.score, 10, rdt) + 1) : g.score;
  if (g.banner) { g.banner.t += rdt; if (g.banner.t > g.banner.dur) g.banner = null; }

  if (state === 'dying') { g.deathT -= rdt; if (g.deathT <= 0) gameOver(); }
}

function update(rdt) {
  globalT += rdt;
  mouse.wx = (mouse.x - view.ox) / view.scale;
  mouse.wy = (mouse.y - view.oy) / view.scale;
  mouse.kick = Math.max(0, mouse.kick - rdt * 6);
  if (state === 'playing' || state === 'dying') updateGame(rdt);
  else if (state === 'title') { updateDemo(rdt); updateFx(rdt); }
  else if (state === 'gameover') {
    g.overT += rdt;
    updateFx(rdt);
    g.shownScore = g.score;
  }
  if (state !== 'paused') trauma = Math.max(0, trauma - rdt * 1.6);
}

// =====================================================================
//  TITLE SCREEN ATTRACT MODE
// =====================================================================
const demo = [];
let demoT = 0;
function initDemo() {
  demo.length = 0;
  const types = ['runner', 'runner', 'runner', 'shooter', 'shooter', 'tank', 'runner', 'tank', 'shooter', 'runner'];
  for (const type of types) demo.push(makeDemo(type));
}
function makeDemo(type) {
  const r = type === 'tank' ? 28 : type === 'shooter' ? 17 : 13;
  const a = rand(0, TAU), s = type === 'tank' ? 40 : type === 'shooter' ? 70 : 120;
  return { type, x: rand(100, W - 100), y: rand(100, H - 100), vx: Math.cos(a) * s, vy: Math.sin(a) * s, s, r, rot: rand(0, TAU),
           t: rand(0, 10), color: C[type], flash: 0, hp: 1, maxHp: 1, spawnT: 0, mass: 1 };
}
function updateDemo(dt) {
  demoT += dt;
  for (const e of demo) {
    e.t += dt; e.spawnT = Math.min(1, e.spawnT + dt * 2);
    const a = Math.atan2(e.vy, e.vx) + Math.sin(e.t * 0.7) * dt * 1.2;
    e.vx = Math.cos(a) * e.s; e.vy = Math.sin(a) * e.s;
    e.x += e.vx * dt; e.y += e.vy * dt;
    if (e.x < e.r || e.x > W - e.r) { e.vx *= -1; e.x = clamp(e.x, e.r, W - e.r); }
    if (e.y < e.r || e.y > H - e.r) { e.vy *= -1; e.y = clamp(e.y, e.r, H - e.r); }
    e.rot += dt * (e.type === 'shooter' ? 2.2 : 0.6);
  }
  if (demoT > 1.6) {
    demoT = 0;
    const i = Math.floor(Math.random() * demo.length);
    const e = demo[i];
    explosion(e.x, e.y, e.color, e.type === 'tank' ? 1.4 : 0.9);
    demo[i] = makeDemo(e.type);
  }
}

// =====================================================================
//  RENDERING — WORLD
// =====================================================================
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.drawImage(bgCanvas, 0, 0);

  // screen shake
  let sx = 0, sy = 0;
  if (trauma > 0) {
    const s = trauma * trauma * 24 * ui, t = globalT;
    sx = s * (Math.sin(t * 61.3) * 0.6 + Math.sin(t * 97.1 + 1.3) * 0.4);
    sy = s * (Math.sin(t * 71.7 + 2.1) * 0.6 + Math.sin(t * 89.3 + 0.4) * 0.4);
  }
  const k = dpr * view.scale;
  ctx.setTransform(k, 0, 0, k, dpr * (view.ox + sx), dpr * (view.oy + sy));
  drawWorld();

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buttons = [];
  if (state === 'title') drawTitle();
  else {
    drawScreenFx();
    drawHUD();
    if (state === 'paused') drawPause();
    else if (state === 'gameover') drawGameOver();
  }
  drawCursor();
}

function drawWorld() {
  ctx.drawImage(floorCanvas, 0, 0, W, H);
  const bossAlive = g && g.boss;
  // arena border
  const pulse = 0.5 + 0.5 * Math.sin(globalT * (bossAlive ? 6 : 2));
  const bc = bossAlive ? C.boss : '#3d7bff';
  ctx.strokeStyle = hexA(bc, 0.18 + 0.12 * pulse); ctx.lineWidth = 14;
  ctx.strokeRect(-7, -7, W + 14, H + 14);
  ctx.strokeStyle = hexA(bc, 0.85); ctx.lineWidth = 3;
  ctx.strokeRect(-1.5, -1.5, W + 3, H + 3);
  // corner brackets
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4; ctx.globalAlpha = 0.6;
  for (const [cx, cy, dx, dy] of [[0, 0, 1, 1], [W, 0, -1, 1], [0, H, 1, -1], [W, H, -1, -1]]) {
    ctx.beginPath(); ctx.moveTo(cx + dx * 50, cy); ctx.lineTo(cx, cy); ctx.lineTo(cx, cy + dy * 50); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  if (state === 'title') {
    for (const e of demo) drawEnemy(e);
    drawParticles();
    return;
  }
  if (!g) return;

  for (const k of g.pickups) drawPickup(k);
  for (const s of g.spawns) drawSpawn(s);

  // player bullets
  ctx.globalCompositeOperation = 'lighter';
  for (const b of g.bullets) {
    drawGlow(b.color, b.x, b.y, 16, 0.6);
    ctx.strokeStyle = b.color; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(b.x - b.vx * 0.022, b.y - b.vy * 0.022); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';

  if (g.boss && g.boss.pat === 'charge' && g.boss.sub === 0 && g.boss.spawnT >= 1 && !g.p.dead) drawChargeTelegraph(g.boss);
  for (const e of g.enemies) e.type === 'boss' ? drawBoss(e) : drawEnemy(e);
  if (!g.p.dead) drawPlayer(g.p);

  // enemy bullets
  ctx.globalCompositeOperation = 'lighter';
  for (const b of g.ebullets) drawGlow(b.color, b.x, b.y, b.r * 3.2, 0.85);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#ffffff';
  for (const b of g.ebullets) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.55, 0, TAU); ctx.fill(); }

  drawParticles();
  drawTexts();
}

function drawParticles() {
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    const t = p.life / p.max;
    switch (p.kind) {
      case 'spark':
        ctx.strokeStyle = p.color; ctx.globalAlpha = t; ctx.lineWidth = p.size; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); ctx.stroke();
        break;
      case 'dot': {
        const s = p.size * (0.4 + 0.6 * t);
        ctx.fillStyle = p.color; ctx.globalAlpha = t;
        ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
        break;
      }
      case 'flash':
        drawGlow(p.color, p.x, p.y, p.size * (1.2 - 0.4 * t), t);
        break;
      case 'ring': {
        const e = easeOutCubic(1 - t);
        ctx.strokeStyle = p.color; ctx.globalAlpha = t; ctx.lineWidth = 2 + 6 * t;
        ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.1, p.size * e), 0, TAU); ctx.stroke();
        break;
      }
      case 'debris':
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color; ctx.globalAlpha = Math.min(1, t * 1.5);
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        ctx.restore();
        break;
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawTexts() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of texts) {
    const a = Math.min(1, t.life / t.max * 2);
    const pop = 1 + 0.4 * Math.max(0, (t.life / t.max - 0.8) * 5);
    ctx.globalAlpha = a;
    ctx.font = `800 ${Math.round(t.size * pop)}px ${FONT}`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

function drawPlayer(p) {
  const blink = p.inv > 0 && Math.floor(p.inv * 20) % 2 === 0;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(p.rapid > 0 ? C.rapid : C.player, 0, 0, p.r * 3.2, 0.35);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = blink ? 0.35 : 1;

  ctx.rotate(p.aim);
  // barrel
  const kick = p.kick * 5;
  ctx.fillStyle = p.rapid > 0 ? C.rapid : '#bdf8ff';
  roundRect(p.r * 0.3 - kick, -4.5, p.r * 1.25, 9, 3); ctx.fill();
  if (p.rapid > 0) { roundRect(p.r * 0.2 - kick, -9, p.r * 0.9, 4, 2); ctx.fill(); roundRect(p.r * 0.2 - kick, 5, p.r * 0.9, 4, 2); ctx.fill(); }
  // body
  ctx.beginPath(); ctx.arc(0, 0, p.r, 0, TAU);
  ctx.fillStyle = p.flash > 0 ? '#ffffff' : '#0b1d2a'; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = p.flash > 0 ? '#ff5a6e' : C.player; ctx.stroke();
  // cockpit chevron
  ctx.fillStyle = C.player;
  ctx.beginPath(); ctx.moveTo(p.r * 0.65, 0); ctx.lineTo(-p.r * 0.35, p.r * 0.45); ctx.lineTo(-p.r * 0.1, 0); ctx.lineTo(-p.r * 0.35, -p.r * 0.45);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  if (p.shield > 0) {
    const fade = p.shield < 1.2 ? (Math.floor(p.shield * 10) % 2 ? 0.25 : 0.9) : 0.9;
    ctx.save(); ctx.translate(p.x, p.y);
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(C.shield, 0, 0, p.r * 3, 0.25 * fade);
    ctx.globalAlpha = fade;
    ctx.strokeStyle = C.shield; ctx.lineWidth = 2.5;
    polygon(6, p.r * 1.9, globalT * 1.5); ctx.stroke();
    ctx.globalAlpha = fade * 0.4;
    polygon(6, p.r * 1.6, -globalT * 2); ctx.stroke();
    ctx.restore();
  }
}

function drawEnemy(e) {
  const sc = e.spawnT < 1 ? Math.max(0.01, easeOutBack(e.spawnT)) : 1;
  const fl = e.flash > 0;
  const fill = fl ? '#ffffff' : hexA(e.color, 0.2);
  const stroke = fl ? '#ffffff' : e.color;
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.scale(sc, sc);
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(e.color, 0, 0, e.r * 2.6, fl ? 0.8 : 0.32);
  ctx.globalCompositeOperation = 'source-over';
  ctx.lineWidth = 2.5; ctx.strokeStyle = stroke; ctx.fillStyle = fill;
  const r = e.r;
  if (e.type === 'runner') {
    ctx.rotate(Math.atan2(e.vy, e.vx));
    ctx.beginPath();
    ctx.moveTo(r * 1.35, 0); ctx.lineTo(-r, r * 0.9); ctx.lineTo(-r * 0.45, 0); ctx.lineTo(-r, -r * 0.9);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = fl ? '#fff' : e.color;
    ctx.beginPath(); ctx.arc(r * 0.3, 0, r * 0.22, 0, TAU); ctx.fill();
  } else if (e.type === 'tank') {
    ctx.rotate(e.rot);
    polygon(6, r, 0); ctx.fill(); ctx.lineWidth = 3.5; ctx.stroke();
    const hpT = clamp(e.hp / e.maxHp, 0, 1);
    ctx.fillStyle = fl ? '#ffffff' : hexA(e.color, 0.35 + 0.5 * hpT);
    polygon(6, r * 0.55, Math.PI / 6); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = stroke;
    polygon(6, r * 0.55, Math.PI / 6); ctx.stroke();
  } else if (e.type === 'shooter') {
    ctx.save(); ctx.rotate(e.rot);
    ctx.beginPath(); ctx.moveTo(r * 1.25, 0); ctx.lineTo(0, r * 0.85); ctx.lineTo(-r * 1.25, 0); ctx.lineTo(0, -r * 0.85); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
    const charging = e.fireT !== undefined && e.fireT < 0.45 && e.spawnT >= 1;
    const cr = charging ? r * (0.35 + 0.35 * (1 - e.fireT / 0.45)) : r * 0.32;
    if (charging) { ctx.globalCompositeOperation = 'lighter'; drawGlow(C.ebullet, 0, 0, cr * 3, 0.9); ctx.globalCompositeOperation = 'source-over'; }
    ctx.fillStyle = charging ? '#ffffff' : (fl ? '#fff' : e.color);
    ctx.beginPath(); ctx.arc(0, 0, cr, 0, TAU); ctx.fill();
  }
  ctx.restore();
  if (e.hp < e.maxHp && e.hp > 0 && e.type !== 'runner') {
    const w = e.r * 2, y = e.y - e.r - 12;
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(e.x - w / 2 - 1, y - 1, w + 2, 6);
    ctx.fillStyle = e.color; ctx.fillRect(e.x - w / 2, y, w * clamp(e.hp / e.maxHp, 0, 1), 4);
  }
}

function drawBoss(e) {
  const sc = e.spawnT < 1 ? Math.max(0.01, easeOutBack(e.spawnT)) : 1;
  const fl = e.flash > 0;
  const col = e.enraged ? '#ff3355' : C.boss;
  const winding = e.pat === 'charge' && e.sub === 0;
  const dashing = e.pat === 'charge' && e.sub === 1;
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.scale(sc, sc);
  const r = e.r;
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(col, 0, 0, r * 2.8, fl ? 0.9 : clamp(0.45 + (winding ? 0.3 * Math.sin(globalT * 30) : 0), 0, 1));
  ctx.globalCompositeOperation = 'source-over';
  ctx.save();
  ctx.rotate(e.rot);
  // spiked outer hull
  ctx.beginPath();
  const spikes = 12;
  for (let i = 0; i < spikes * 2; i++) {
    const a = i * Math.PI / spikes, rr = i % 2 === 0 ? r * 1.18 : r * 0.88;
    if (i === 0) ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.fillStyle = fl ? '#ffffff' : hexA(col, 0.22); ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = fl ? '#ffffff' : col; ctx.stroke();
  ctx.rotate(-e.rot * 2);
  ctx.lineWidth = 2.5;
  polygon(8, r * 0.7, 0); ctx.strokeStyle = fl ? '#fff' : hexA(col, 0.8); ctx.stroke();
  ctx.restore();
  // eye
  ctx.fillStyle = '#12020f';
  ctx.beginPath(); ctx.arc(0, 0, r * 0.42, 0, TAU); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = col; ctx.stroke();
  let ea = 0, ed = 0;
  if (g && !g.p.dead) { ea = Math.atan2(g.p.y - e.y, g.p.x - e.x); ed = r * 0.16; }
  const pr = r * (winding || dashing ? 0.26 : 0.18) * (1 + 0.1 * Math.sin(globalT * 8));
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(winding ? '#ff3355' : '#ffffff', Math.cos(ea) * ed, Math.sin(ea) * ed, pr * 3, 0.8);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = winding || dashing ? '#ff3355' : '#ffffff';
  ctx.beginPath(); ctx.arc(Math.cos(ea) * ed, Math.sin(ea) * ed, pr, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawChargeTelegraph(e) {
  const pulse = 0.5 + 0.5 * Math.sin(globalT * 28);
  const prog = 1 - clamp(e.pt / 0.9, 0, 1);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  ctx.translate(e.x, e.y); ctx.rotate(Math.atan2(e.cdy, e.cdx));
  ctx.fillStyle = `rgba(255,51,85,${0.06 + 0.1 * prog})`;
  ctx.fillRect(0, -e.r, 2400, e.r * 2);
  ctx.strokeStyle = `rgba(255,51,85,${0.35 + 0.4 * pulse})`; ctx.lineWidth = 2;
  ctx.setLineDash([18, 14]); ctx.lineDashOffset = -globalT * 200;
  ctx.beginPath(); ctx.moveTo(0, -e.r); ctx.lineTo(2400, -e.r); ctx.moveTo(0, e.r); ctx.lineTo(2400, e.r); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawSpawn(s) {
  const k = clamp(s.t / s.dur, 0, 1);
  const col = C[s.type];
  const big = s.type === 'boss';
  const R = big ? 90 : s.type === 'tank' ? 34 : 22;
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(col, 0, 0, R * 2 * k + 6, 0.5 * k);
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = col; ctx.globalAlpha = 0.3 + 0.7 * k; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, lerp(R * 3, R, easeOutCubic(k)), 0, TAU); ctx.stroke();
  ctx.rotate(globalT * 4);
  ctx.setLineDash([6, 8]);
  ctx.beginPath(); ctx.arc(0, 0, R * 1.2, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawPickup(k) {
  const col = C[k.type];
  const blink = k.life < 3 && Math.floor(k.life * 8) % 2 === 0;
  if (blink) return;
  const bob = Math.sin(k.t * 4) * 3;
  const appear = Math.min(1, k.t * 5);
  ctx.save();
  ctx.translate(k.x, k.y + bob);
  ctx.scale(appear, appear);
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(col, 0, 0, 40, 0.45 + 0.15 * Math.sin(k.t * 6));
  ctx.globalCompositeOperation = 'source-over';
  ctx.rotate(Math.sin(k.t * 2) * 0.15);
  roundRect(-14, -14, 28, 28, 7);
  ctx.fillStyle = 'rgba(5,10,20,0.85)'; ctx.fill();
  ctx.lineWidth = 2.5; ctx.strokeStyle = col; ctx.stroke();
  drawPickupIcon(k.type, 0, 0, 1);
  ctx.restore();
}
function drawPickupIcon(type, x, y, s) {
  const col = C[type];
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = col; ctx.strokeStyle = col;
  if (type === 'health') {
    ctx.fillRect(-3, -9, 6, 18); ctx.fillRect(-9, -3, 18, 6);
  } else if (type === 'rapid') {
    ctx.beginPath(); ctx.moveTo(3, -10); ctx.lineTo(-6, 2); ctx.lineTo(0, 2); ctx.lineTo(-3, 10); ctx.lineTo(6, -2); ctx.lineTo(0, -2);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.lineWidth = 2.5; polygon(6, 9, Math.PI / 6); ctx.stroke();
    ctx.globalAlpha = 0.5; polygon(6, 4.5, Math.PI / 6); ctx.fill();
  }
  ctx.restore();
}

// =====================================================================
//  RENDERING — SCREEN SPACE (HUD, MENUS)
// =====================================================================
function font(weight, size) { return `${weight} ${Math.round(size)}px ${FONT}`; }
function text(str, x, y, size, color, align = 'left', weight = 700, baseline = 'middle') {
  ctx.font = font(weight, size); ctx.textAlign = align; ctx.textBaseline = baseline;
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function glowText(str, x, y, size, color, blur, weight = 900) {
  ctx.save();
  ctx.font = font(weight, size); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = color; ctx.shadowBlur = blur;
  ctx.fillStyle = color; ctx.fillText(str, x, y);
  ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText(str, x, y);
  ctx.restore();
}

function drawScreenFx() {
  if (!g) return;
  const p = g.p;
  // damage flash
  if (g.hurtFlash > 0) {
    ctx.fillStyle = `rgba(255,40,70,${g.hurtFlash * 0.22})`;
    ctx.fillRect(0, 0, cssW, cssH);
  }
  // low-HP vignette
  const low = !p.dead && p.hp < 35 ? (1 - p.hp / 35) : 0;
  const v = Math.max(low * (0.55 + 0.45 * Math.sin(globalT * 6)), g.hurtFlash * 0.8);
  if (v > 0.01) {
    const gr = ctx.createRadialGradient(cssW / 2, cssH / 2, Math.min(cssW, cssH) * 0.35, cssW / 2, cssH / 2, Math.max(cssW, cssH) * 0.75);
    gr.addColorStop(0, 'rgba(255,0,40,0)'); gr.addColorStop(1, `rgba(255,0,40,${0.45 * v})`);
    ctx.fillStyle = gr; ctx.fillRect(0, 0, cssW, cssH);
  }
}

function drawHUD() {
  if (!g) return;
  const p = g.p, s = ui, pad = 20 * s;

  // ---- health (top-left)
  const bw = 250 * s, bh = 16 * s, bx = pad, by = pad + 18 * s;
  text('HULL', bx, pad + 4 * s, 13 * s, 'rgba(200,230,255,0.75)', 'left', 800);
  text(Math.ceil(p.hp) + ' / ' + p.maxHp, bx + bw, pad + 4 * s, 13 * s, 'rgba(200,230,255,0.75)', 'right', 700);
  roundRect(bx - 2, by - 2, bw + 4, bh + 4, 5 * s); ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fill();
  ctx.strokeStyle = 'rgba(120,180,255,0.35)'; ctx.lineWidth = 1; ctx.stroke();
  const hr = clamp(p.hp / p.maxHp, 0, 1), tr = clamp(p.hpTrail / p.maxHp, 0, 1);
  if (tr > hr) { ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fillRect(bx, by, bw * tr, bh); }
  const hcol = hr > 0.6 ? C.health : hr > 0.3 ? C.rapid : '#ff4d6d';
  if (hr > 0) {
    const gr = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    gr.addColorStop(0, hexA(hcol, 0.75)); gr.addColorStop(1, hcol);
    ctx.fillStyle = gr; ctx.fillRect(bx, by, bw * hr, bh);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  for (let i = 1; i < 10; i++) ctx.fillRect(bx + bw * i / 10 - 0.5, by, 1, bh);

  // power-ups
  let py = by + bh + 16 * s;
  const pw = [];
  if (p.rapid > 0) pw.push(['rapid', 'RAPID FIRE', p.rapid / 10]);
  if (p.shield > 0) pw.push(['shield', 'SHIELD', p.shield / 5]);
  for (const [type, label, frac] of pw) {
    const remain = type === 'rapid' ? p.rapid : p.shield;
    roundRect(bx - 2, py - 2, 168 * s, 26 * s, 6 * s); ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fill();
    drawPickupIcon(type, bx + 12 * s, py + 11 * s, 0.75 * s);
    text(label, bx + 26 * s, py + 7 * s, 11 * s, C[type], 'left', 800);
    text(remain.toFixed(1) + 's', bx + 160 * s, py + 7 * s, 11 * s, 'rgba(255,255,255,0.8)', 'right', 700);
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(bx + 26 * s, py + 15 * s, 134 * s, 4 * s);
    ctx.fillStyle = C[type]; ctx.fillRect(bx + 26 * s, py + 15 * s, 134 * s * frac, 4 * s);
    py += 32 * s;
  }

  // ---- wave (top-center)
  const wx = cssW / 2;
  const boss = isBossWave(g.wave) && g.waveState === 'active';
  text(g.wave > 0 ? 'WAVE ' + g.wave : 'WAVE —', wx, pad + 14 * s, 26 * s, boss ? C.boss : '#e8f4ff', 'center', 900);
  let sub;
  if (g.waveState === 'break') sub = g.wave === 0 ? 'starting in ' + Math.max(0, g.breakT).toFixed(1) : 'next wave in ' + Math.max(0, g.breakT).toFixed(1);
  else { const left = g.queue.length + g.spawns.length + g.enemies.length; sub = left + (left === 1 ? ' hostile' : ' hostiles') + ' remaining'; }
  text(sub, wx, pad + 40 * s, 12 * s, 'rgba(200,220,255,0.65)', 'center', 600);

  // ---- score (top-right)
  const rx = cssW - pad;
  text('SCORE', rx, pad + 4 * s, 13 * s, 'rgba(200,230,255,0.75)', 'right', 800);
  text(Math.floor(g.shownScore).toLocaleString(), rx, pad + 30 * s, 32 * s, '#ffffff', 'right', 900);
  const best = Math.max(highScore, Math.floor(g.shownScore));
  text('BEST ' + best.toLocaleString(), rx, pad + 56 * s, 12 * s, g.shownScore > highScore ? C.rapid : 'rgba(200,220,255,0.6)', 'right', 700);

  // ---- combo
  if (g.combo > 1 && g.comboT > 0 && state !== 'gameover') {
    const cy = pad + 92 * s;
    const pop = 1 + g.comboPulse * 0.35;
    ctx.save();
    ctx.translate(rx, cy); ctx.scale(pop, pop);
    const mcol = g.mult >= 5 ? '#ff4fd8' : g.mult >= 3 ? '#ff8a3d' : C.rapid;
    text('x' + g.mult, 0, 0, 34 * s, mcol, 'right', 900);
    ctx.restore();
    text(g.combo + ' COMBO', rx - 70 * s, cy + 1 * s, 13 * s, 'rgba(255,255,255,0.85)', 'right', 800);
    const cw = 150 * s;
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(rx - cw, cy + 22 * s, cw, 4 * s);
    ctx.fillStyle = mcol; ctx.fillRect(rx - cw * (g.comboT / COMBO_WINDOW), cy + 22 * s, cw * (g.comboT / COMBO_WINDOW), 4 * s);
  }

  // ---- boss bar (bottom-center)
  if (g.boss && !g.boss.dead) {
    const b = g.boss;
    const w = Math.min(620 * s, cssW * 0.7), h = 14 * s, x = (cssW - w) / 2, y = cssH - pad - h - 4 * s;
    const appear = b.spawnT;
    ctx.globalAlpha = appear;
    text(b.name + (b.enraged ? '  —  ENRAGED' : ''), cssW / 2, y - 14 * s, 15 * s, b.enraged ? '#ff3355' : C.boss, 'center', 900);
    roundRect(x - 3, y - 3, w + 6, h + 6, 6 * s); ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fill();
    ctx.strokeStyle = hexA(C.boss, 0.6); ctx.lineWidth = 1.5; ctx.stroke();
    const fr = clamp(b.hp / b.maxHp, 0, 1);
    const gr = ctx.createLinearGradient(x, 0, x + w, 0);
    gr.addColorStop(0, '#ff3355'); gr.addColorStop(1, C.boss);
    ctx.fillStyle = gr; ctx.fillRect(x, y, w * fr * appear, h);
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(x + w * 0.5 - 1, y, 2, h);
    ctx.globalAlpha = 1;
  }

  // ---- hints (bottom-left)
  text('P pause  ·  M ' + (Sfx.muted ? 'unmute' : 'mute'), pad, cssH - pad, 11 * s, 'rgba(200,220,255,0.35)', 'left', 600);

  // ---- banner
  if (g.banner && state !== 'gameover') {
    const bn = g.banner, t = bn.t;
    const inT = clamp(t / 0.35, 0, 1), outT = clamp((bn.dur - t) / 0.5, 0, 1);
    const a = Math.min(inT, outT);
    const scl = lerp(1.6, 1, easeOutCubic(inT));
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(cssW / 2, cssH * 0.36); ctx.scale(scl, scl);
    const bandH = 92 * s;
    const gr = ctx.createLinearGradient(-cssW / 2, 0, cssW / 2, 0);
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(0.5, 'rgba(0,0,0,0.55)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gr; ctx.fillRect(-cssW / 2, -bandH / 2, cssW, bandH);
    glowText(bn.title, 0, -10 * s, 52 * s, bn.color, 24 * s);
    text(bn.sub, 0, 30 * s, 16 * s, 'rgba(230,240,255,0.85)', 'center', 700);
    ctx.restore();
  }
}

function button(label, cx, cy, w, h, action, primary) {
  const x = cx - w / 2, y = cy - h / 2;
  const hov = mouse.x >= x && mouse.x <= x + w && mouse.y >= y && mouse.y <= y + h;
  buttons.push({ x, y, w, h, action, label });
  if (hov && hovered !== label) Sfx.hover();
  if (hov) hovered = label;
  const col = primary ? C.player : '#9fb6ff';
  ctx.save();
  if (hov) { ctx.shadowColor = col; ctx.shadowBlur = 18 * ui; }
  roundRect(x, y, w, h, 10 * ui);
  ctx.fillStyle = hov ? hexA(col, 0.28) : hexA(col, primary ? 0.12 : 0.06); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = 2; ctx.strokeStyle = hov ? '#ffffff' : col; ctx.stroke();
  ctx.restore();
  text(label, cx, cy + 1, h * 0.42, hov ? '#ffffff' : col, 'center', 900);
}
function endButtons() {
  // reset hover tracking when the cursor isn't over any button
  if (!buttonAt(mouse.x, mouse.y)) hovered = null;
}

function drawTitle() {
  const s = ui, cx = cssW / 2;
  ctx.fillStyle = 'rgba(2,3,10,0.55)'; ctx.fillRect(0, 0, cssW, cssH);
  const ty = cssH * 0.27;
  const wob = Math.sin(globalT * 2) * 4 * s;
  glowText('NEON SIEGE', cx, ty + wob, Math.min(118 * s, cssW * 0.12), C.player, 40 * s);
  text('A R E N A   S U R V I V A L', cx, ty + 70 * s, 17 * s, '#ff4fd8', 'center', 800);

  button('START', cx, cssH * 0.5, 240 * s, 58 * s, startGame, true);

  const ly = cssH * 0.5 + 70 * s;
  const lines = [
    ['WASD', 'move'], ['MOUSE', 'aim'], ['CLICK / HOLD', 'shoot'], ['P', 'pause'], ['M', 'toggle sound']
  ];
  ctx.font = font(800, 14 * s);
  lines.forEach(([k, d], i) => {
    const y = ly + i * 24 * s;
    text(k, cx - 10 * s, y, 14 * s, '#e8f4ff', 'right', 800);
    text(d, cx + 10 * s, y, 14 * s, 'rgba(200,220,255,0.6)', 'left', 600);
  });

  // enemy legend
  const legY = ly + lines.length * 24 * s + 30 * s;
  const leg = [['runner', 'SWARMER', 'fast · fragile'], ['tank', 'BRUTE', 'slow · armored'], ['shooter', 'GUNNER', 'ranged'],
               ['health', 'REPAIR', '+30 hull'], ['rapid', 'OVERDRIVE', 'rapid fire 10s'], ['shield', 'AEGIS', 'shield 5s']];
  const colW = Math.min(150 * s, cssW / 6.4);
  leg.forEach(([type, name, desc], i) => {
    const x = cx + (i - 2.5) * colW;
    ctx.save(); ctx.translate(x, legY);
    if (C[type] && ['runner', 'tank', 'shooter'].includes(type)) {
      ctx.strokeStyle = C[type]; ctx.fillStyle = hexA(C[type], 0.2); ctx.lineWidth = 2;
      const r = 10 * s;
      if (type === 'runner') { ctx.beginPath(); ctx.moveTo(r * 1.3, 0); ctx.lineTo(-r, r * 0.9); ctx.lineTo(-r * 0.45, 0); ctx.lineTo(-r, -r * 0.9); ctx.closePath(); }
      else if (type === 'tank') polygon(6, r, 0);
      else { ctx.beginPath(); ctx.moveTo(r * 1.25, 0); ctx.lineTo(0, r * 0.85); ctx.lineTo(-r * 1.25, 0); ctx.lineTo(0, -r * 0.85); ctx.closePath(); }
      ctx.fill(); ctx.stroke();
    } else drawPickupIcon(type, 0, 0, 0.9 * s);
    ctx.restore();
    text(name, x, legY + 22 * s, 11 * s, C[type], 'center', 900);
    text(desc, x, legY + 37 * s, 10 * s, 'rgba(200,220,255,0.55)', 'center', 600);
  });

  text('HIGH SCORE  ' + highScore.toLocaleString(), cx, cssH - 38 * s, 15 * s, C.rapid, 'center', 800);
  text('Every 5th wave is a boss wave · chain kills within 2s for a combo multiplier', cx, cssH - 14 * s, 11 * s, 'rgba(200,220,255,0.4)', 'center', 600);
  endButtons();
}

function drawPause() {
  const s = ui, cx = cssW / 2;
  ctx.fillStyle = 'rgba(2,3,10,0.6)'; ctx.fillRect(0, 0, cssW, cssH);
  glowText('PAUSED', cx, cssH * 0.36, 72 * s, C.player, 30 * s);
  button('RESUME', cx, cssH * 0.5, 260 * s, 54 * s, () => setPaused(false), true);
  button('QUIT TO MENU', cx, cssH * 0.5 + 70 * s, 260 * s, 54 * s, toMenu, false);
  text('Press P to resume', cx, cssH * 0.5 + 130 * s, 13 * s, 'rgba(200,220,255,0.55)', 'center', 600);
  endButtons();
}

function drawGameOver() {
  const s = ui, cx = cssW / 2;
  const a = clamp(g.overT / 0.6, 0, 1);
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(8,0,6,0.7)'; ctx.fillRect(0, 0, cssW, cssH);
  const drop = (1 - easeOutCubic(a)) * -40 * s;
  glowText('GAME OVER', cx, cssH * 0.22 + drop, Math.min(92 * s, cssW * 0.11), '#ff3355', 34 * s);

  const sy = cssH * 0.36;
  text('FINAL SCORE', cx, sy, 14 * s, 'rgba(200,220,255,0.7)', 'center', 800);
  text(g.score.toLocaleString(), cx, sy + 40 * s, 54 * s, '#ffffff', 'center', 900);
  if (g.newRecord) {
    const fl = 0.6 + 0.4 * Math.sin(globalT * 8);
    ctx.globalAlpha = a * fl;
    glowText('NEW HIGH SCORE!', cx, sy + 84 * s, 22 * s, C.rapid, 16 * s);
    ctx.globalAlpha = a;
  } else {
    text('HIGH SCORE  ' + highScore.toLocaleString(), cx, sy + 84 * s, 15 * s, C.rapid, 'center', 800);
  }
  const stats = [['WAVE', g.wave], ['KILLS', g.kills], ['BEST COMBO', g.maxCombo], ['BOSSES', g.bossesKilled]];
  const colW = Math.min(140 * s, cssW / 4.6);
  stats.forEach(([k, v], i) => {
    const x = cx + (i - 1.5) * colW, y = sy + 130 * s;
    text(String(v), x, y, 28 * s, '#e8f4ff', 'center', 900);
    text(k, x, y + 24 * s, 11 * s, 'rgba(200,220,255,0.6)', 'center', 800);
  });
  if (g.overT > 0.4) {
    const by = sy + 220 * s;
    button('PLAY AGAIN', cx, by, 260 * s, 56 * s, startGame, true);
    button('MAIN MENU', cx, by + 70 * s, 260 * s, 50 * s, toMenu, false);
    text('Enter / R to restart  ·  Esc for menu', cx, by + 120 * s, 12 * s, 'rgba(200,220,255,0.5)', 'center', 600);
  }
  ctx.globalAlpha = 1;
  endButtons();
}

function drawCursor() {
  const x = mouse.x, y = mouse.y;
  if (x < 0 || y < 0) return;
  const s = ui;
  const overBtn = !!buttonAt(x, y);
  const inGame = (state === 'playing') && !overBtn;
  const col = inGame ? (g && g.p.rapid > 0 ? C.rapid : '#ffffff') : C.player;
  const r = (inGame ? 11 : 8) * s * (1 + mouse.kick * 0.5);
  ctx.save();
  ctx.strokeStyle = col; ctx.lineWidth = 2;
  ctx.shadowColor = col; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  if (inGame) {
    const a = r + 3 * s, b = r + 9 * s;
    ctx.beginPath();
    ctx.moveTo(x - b, y); ctx.lineTo(x - a, y); ctx.moveTo(x + a, y); ctx.lineTo(x + b, y);
    ctx.moveTo(x, y - b); ctx.lineTo(x, y - a); ctx.moveTo(x, y + a); ctx.lineTo(x, y + b);
    ctx.stroke();
  }
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(x, y, 2, 0, TAU); ctx.fill();
  ctx.restore();
}

// =====================================================================
//  MAIN LOOP
// =====================================================================
let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let rdt = (now - lastT) / 1000;
  lastT = now;
  if (!(rdt > 0)) rdt = 0;
  rdt = Math.min(rdt, 0.05);          // clamp after tab switches / hitches
  update(rdt);
  render();
}

resize();
